openapi: 3.0.0
info:
  title: Брендбук-генератор API
  description: API для онлайн-сервиса генерации брендбуков с помощью ИИ.
  version: 1.0.0

servers:
  - url: http://localhost:8080/api/v1
    description: Локальный сервер разработки

tags:
  - name: Auth
    description: Аутентификация и регистрация
  - name: Users
    description: Пользователи и профили
  - name: Projects
    description: Создание, редактирование и генерация проектов

paths:
  /auth/register:
    post:
      summary: Регистрация нового пользователя
      tags: [ Auth ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Пользователь успешно зарегистрирован
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          description: Ошибка валидации формата данных (email/пароль/никнейм не проходят требования)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
              examples:
                InvalidEmail:
                  summary: Некорректный email
                  value:
                    code: "INVALID_EMAIL"
                    message: "Email is invalid"
                    field: "email"
                InvalidPassword:
                  summary: Пароль не проходит требования
                  value:
                    code: "INVALID_PASSWORD"
                    message: "Password must be 8-128 chars and contain letters and digits"
                    field: "password"
                InvalidNickname:
                  summary: Никнейм не проходит требования
                  value:
                    code: "INVALID_NICKNAME"
                    message: "Nickname must be 3-64 chars"
                    field: "nickname"
        '409':
          description: Конфликт данных (email или nickname уже занят)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
              examples:
                EmailTaken:
                  summary: Email уже занят
                  value:
                    code: "EMAIL_EXISTS"
                    message: "Пользователь с таким email уже зарегистрирован"
                    field: "email"
                NicknameTaken:
                  summary: Никнейм уже занят
                  value:
                    code: "NICKNAME_EXISTS"
                    message: "Этот никнейм уже занят другим пользователем"
                    field: "nickname"
        '500':
          description: Внутренняя ошибка сервера

  /auth/login:
    post:
      summary: Вход в систему (получение токена)
      tags: [ Auth ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Успешный вход
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          description: Неверный email, пароль или одно из полей не передано
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthError'
              example:
                code: "INVALID_CREDENTIALS"
                message: "Invalid email or password"
        '500':
          description: Внутренняя ошибка сервера

  /users/{id}:
    get:
      summary: Получить профиль пользователя
      tags: [ Users ]
      security:
        - BearerAuth: [ ]
        - { }
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            example: "123e4567-e89b-12d3-a456-426614174000"
      responses:
        '200':
          description: Профиль пользователя
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/UserProfile'
                  - type: object
                    properties:
                      projects:
                        type: array
                        items:
                          $ref: '#/components/schemas/ProjectDescription'
        '404':
          description: Пользователь не найден
        '500':
          description: Внутренняя ошибка сервера

  /users/{id}/subscribe:
    post:
      summary: Подписаться на пользователя
      tags: [ Users ]
      security:
        - BearerAuth: [ ]
      parameters:
        - name: id
          in: path
          required: true
          description: Идентификатор пользователя, на которого оформляется подписка
          schema:
            type: string
            example: "123e4567-e89b-12d3-a456-426614174000"
      responses:
        '200':
          description: Подписка успешно оформлена (в т.ч. повторно — операция идемпотентна)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
              example:
                message: "Subscribed successfully"
        '400':
          description: Нельзя подписаться на самого себя
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
              example:
                message: "Cannot subscribe to yourself"
        '401':
          description: Отсутствует или некорректен JWT
        '404':
          description: Пользователь, на которого оформляется подписка, не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
              example:
                message: "User not found"
        '500':
          description: Внутренняя ошибка сервера

    delete:
      summary: Отписаться от пользователя
      tags: [ Users ]
      security:
        - BearerAuth: [ ]
      parameters:
        - name: id
          in: path
          required: true
          description: Идентификатор пользователя, от которого отписываются
          schema:
            type: string
            example: "123e4567-e89b-12d3-a456-426614174000"
      responses:
        '200':
          description: >
            Подписка успешно отменена. Операция ничего не проверяет, кроме
            авторизации — сработает 200, даже если подписки не было или
            пользователь id не существует.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
              example:
                message: "Unsubscribed successfully"
        '401':
          description: Отсутствует или некорректен JWT
        '500':
          description: Внутренняя ошибка сервера

  /projects:
    post:
      summary: Создать новый проект
      tags: [ Projects ]
      security:
        - BearerAuth: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
              properties:
                name:
                  type: string
                  example: "Бренд кофейни"
                description:
                  type: string
                  example: "Минималистичный стиль, темные тона, для спешелти кофейни"
      responses:
        '201':
          description: Проект создан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '400':
          description: Не передано название проекта (name)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
              example:
                message: "Name is required"
        '401':
          description: Отсутствует или некорректен JWT
        '500':
          description: Внутренняя ошибка сервера

  /projects/{id}:
    get:
      summary: Получить проект по ID
      tags: [ Projects ]
      security:
        - BearerAuth: [ ]
        - { }
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Данные проекта
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '401':
          description: Проект приватный, а запрос анонимный (без JWT)
        '403':
          description: >
            Проект приватный, и вы авторизованы, но не автор проекта.
            Также этим кодом отвечает auth-мидлварь, если сам JWT
            невалиден/просрочен (в таком случае наличие прав уже не проверяется).
        '404':
          description: Проект не найден
        '500':
          description: Внутренняя ошибка сервера

    patch:
      summary: Обновить данные проекта (ручное сохранение)
      tags: [ Projects ]
      security:
        - BearerAuth: [ ]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                is_public:
                  type: boolean
                data:
                  type: string
                  description: "Чистая SVG-разметка проекта"
                  example: '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500"><g></g></svg>'
      responses:
        '200':
          description: Проект успешно обновлён. Возвращает полный объект проекта после изменений.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '401':
          description: Отсутствует или некорректен JWT
        '403':
          description: >
            Вы авторизованы, но не автор проекта. Также этим кодом отвечает
            auth-мидлварь при невалидном/просроченном JWT.
        '404':
          description: Проект не найден
        '500':
          description: Внутренняя ошибка сервера

    delete:
      summary: Удаление проекта
      tags: [ Projects ]
      security:
        - BearerAuth: [ ]
      parameters:
        - name: id
          in: path
          required: true
          description: Уникальный идентификатор проекта
          schema:
            type: string
      responses:
        '200':
          description: Проект удалён
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
              example:
                message: "Project deleted successfully"
        '401':
          description: Отсутствует или некорректен JWT
        '403':
          description: >
            Вы авторизованы, но не автор проекта. Также этим кодом отвечает
            auth-мидлварь при невалидном/просроченном JWT.
        '404':
          description: Проект не найден
        '500':
          description: Внутренняя ошибка сервера

  /projects/{id}/generate:
    post:
      summary: Изменение/генерация проекта с помощью ИИ
      tags: [ Projects ]
      security:
        - BearerAuth: [ ]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - prompt
              properties:
                prompt:
                  type: string
                  example: "Добавь логотип с изображением кружки"
      responses:
        '200':
          description: Сгенерированный SVG-код проекта
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: string
                    description: "Результат работы нейросети в виде SVG-строки"
                    example: '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500"><circle cx="250" cy="250" r="100" fill="#FF0000"/></svg>'
        '400':
          description: Не передан prompt
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
              example:
                message: "Prompt cannot be empty"
        '401':
          description: Отсутствует или некорректен JWT
        '403':
          description: >
            Вы авторизованы, но не автор проекта. Также этим кодом отвечает
            auth-мидлварь при невалидном/просроченном JWT.
        '404':
          description: Проект не найден
        '500':
          description: Внутренняя ошибка сервера (в т.ч. сбой обращения к LLM)

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    RegisterRequest:
      type: object
      required:
        - email
        - password
        - nickname
      properties:
        email:
          type: string
          format: email
          maxLength: 128
          example: "user@example.com"
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 128
          description: "8-128 символов, обязательно хотя бы одна буква и одна цифра"
          example: "strongPassword123!"
        nickname:
          type: string
          minLength: 3
          maxLength: 64
          example: "John Doe"

    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          example: "user@example.com"
        password:
          type: string
          format: password
          example: "strongPassword123!"

    AuthResponse:
      type: object
      required:
        - access_token
        - token_type
        - user
      properties:
        access_token:
          type: string
          description: Долгоживущий JWT токен для доступа к API
          example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
        token_type:
          type: string
          example: "Bearer"
        user:
          type: object
          description: Данные авторизованного пользователя
          required:
            - id
            - email
            - nickname
          properties:
            id:
              type: string
              description: Уникальный идентификатор авторизованного пользователя
              example: "123e4567-e89b-12d3-a456-426614174000"
            email:
              type: string
              format: email
              example: "user@example.com"
            nickname:
              type: string
              example: "John Doe"

    UserProfile:
      type: object
      properties:
        id:
          type: string
        name:
          type: string

    Project:
      allOf:
        - $ref: '#/components/schemas/ProjectDescription'
        - type: object
          properties:
            data:
              type: string
              description: "Чистая SVG-разметка проекта"
              example: '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500"><g></g></svg>'

    ProjectDescription:
      type: object
      properties:
        id:
          type: string
        author_id:
          type: string
        name:
          type: string
        description:
          type: string
        is_public:
          type: boolean
        created_at:
          type: string
          format: date-time

    ValidationError:
      type: object
      properties:
        code:
          type: string
          description: Строковый код ошибки для обработки на клиенте
          example: "NICKNAME_EXISTS"
        message:
          type: string
          description: Человекочитаемое сообщение
          example: "Этот никнейм уже занят"
        field:
          type: string
          description: Название поля, в котором произошла ошибка
          example: "nickname"

    MessageResponse:
      type: object
      description: Простой ответ вида "успех/ошибка одной строкой", без кода ошибки — используется там, где хендлер не различает конкретные причины сбоя.
      properties:
        message:
          type: string
          example: "Project deleted successfully"

    AuthError:
      type: object
      description: Ошибка аутентификации при входе — код всегда один и тот же, не различает "нет такого email" от "неверный пароль" (чтобы не палить существование email).
      properties:
        code:
          type: string
          example: "INVALID_CREDENTIALS"
        message:
          type: string
          example: "Invalid email or password"
