openapi: 3.0.0
info:
  title: Брендбук-генератор API
  description: API для онлайн-сервиса генерации брендбуков с помощью ИИ.
  version: 1.0.0

servers:
  - url: http://localhost:8080/api/v1
    description: Локальный сервер разработки

tags:
  - name: Auth
    description: Аутентификация и регистрация
  - name: Users
    description: Пользователи и профили
  - name: Projects
    description: Создание, редактирование и генерация проектов

paths:
  /auth/register:
    post:
      summary: Регистрация нового пользователя
      tags: [ Auth ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Пользователь успешно зарегистрирован
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          description: Ошибка валидации формата данных (неверный email, короткий пароль и т.д.)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Конфликт данных (email или nickname уже занят)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
              examples:
                EmailTaken:
                  summary: Email уже занят
                  value:
                    code: "EMAIL_EXISTS"
                    message: "Пользователь с таким email уже зарегистрирован"
                    field: "email"
                NicknameTaken:
                  summary: Никнейм уже занят
                  value:
                    code: "NICKNAME_EXISTS"
                    message: "Этот никнейм уже занят другим пользователем"
                    field: "nickname"

  /auth/login:
    post:
      summary: Вход в систему (получение токена)
      tags: [ Auth ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Успешный вход
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          description: Неверный email или пароль

  /users/{id}:
    get:
      summary: Получить профиль пользователя
      tags: [ Users ]
      security:
        - BearerAuth: [ ]
        - { }
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            example: "123e4567-e89b-12d3-a456-426614174000"
      responses:
        '200':
          description: Профиль пользователя
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/UserProfile'
                  - type: object
                    properties:
                      projects:
                        type: array
                        items:
                          $ref: '#/components/schemas/ProjectDescription'
        '404':
          description: Пользователь не найден

  /projects:
    post:
      summary: Создать новый проект
      tags: [ Projects ]
      security:
        - BearerAuth: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  example: "Бренд кофейни"
                description:
                  type: string
                  example: "Минималистичный стиль, темные тона, для спешелти кофейни"
      responses:
        '201':
          description: Проект создан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '401':
          description: Не авторизован

  /projects/{id}:
    get:
      summary: Получить проект по ID
      tags: [ Projects ]
      security:
        - BearerAuth: [ ]
        - { }
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Данные проекта
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '403':
          description: Нет прав (не автор проекта)
        '404':
          description: Проект не найден

    patch:
      summary: Обновить данные проекта (ручное сохранение)
      tags: [ Projects ]
      security:
        - BearerAuth: [ ]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                is_public:
                  type: boolean
                data:
                  type: string
                  description: "Чистая SVG-разметка проекта"
                  example: '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500"><g></g></svg>'
      responses:
        '200':
          description: Проект успешно обновлен
        '401':
          description: Не авторизован
        '403':
          description: Нет прав (не автор проекта)

    delete:
      summary: Удаление проекта
      tags: [ Projects ]
      security:
        - BearerAuth: [ ]
      parameters:
        - name: id
          in: path
          required: true
          description: Уникальный идентификатор проекта
          schema:
            type: string
      responses:
        '200':
          description: Проект удалён
        '401':
          description: Не авторизован
        '403':
          description: Нет прав (не автор проекта)

  /projects/{id}/generate:
    post:
      summary: Изменение/генерация проекта с помощью ИИ
      tags: [ Projects ]
      security:
        - BearerAuth: [ ]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                prompt:
                  type: string
                  example: "Добавь логотип с изображением кружки"
      responses:
        '200':
          description: Сгенерированный SVG-код проекта
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: string
                    description: "Результат работы нейросети в виде SVG-строки"
                    example: '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500"><circle cx="250" cy="250" r="100" fill="#FF0000"/></svg>'
        '401':
          description: Не авторизован

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    RegisterRequest:
      type: object
      required:
        - email
        - password
        - nickname
      properties:
        email:
          type: string
          format: email
          example: "user@example.com"
        password:
          type: string
          format: password
          example: "strongPassword123!"
        nickname:
          type: string
          example: "John Doe"

    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          example: "user@example.com"
        password:
          type: string
          format: password
          example: "strongPassword123!"

    AuthResponse:
      type: object
      required:
        - access_token
        - token_type
        - user
      properties:
        access_token:
          type: string
          description: Долгоживущий JWT токен для доступа к API
          example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
        token_type:
          type: string
          example: "Bearer"
        user:
          type: object
          description: Данные авторизованного пользователя
          required:
            - id
            - email
            - nickname
          properties:
            id:
              type: string
              description: Уникальный идентификатор авторизованного пользователя
              example: "123e4567-e89b-12d3-a456-426614174000"
            email:
              type: string
              format: email
              example: "user@example.com"
            nickname:
              type: string
              example: "John Doe"

    UserProfile:
      type: object
      properties:
        id:
          type: string
        name:
          type: string

    Project:
      allOf:
        - $ref: '#/components/schemas/ProjectDescription'
        - type: object
          properties:
            data:
              type: string
              description: "Чистая SVG-разметка проекта"
              example: '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500"><g></g></svg>'

    ProjectDescription:
      type: object
      properties:
        id:
          type: string
        author_id:
          type: string
        name:
          type: string
        description:
          type: string
        is_public:
          type: boolean
        created_at:
          type: string
          format: date-time

    ValidationError:
      type: object
      properties:
        code:
          type: string
          description: Строковый код ошибки для обработки на клиенте
          example: "NICKNAME_EXISTS"
        message:
          type: string
          description: Человекочитаемое сообщение
          example: "Этот никнейм уже занят"
        field:
          type: string
          description: Название поля, в котором произошла ошибка
          example: "nickname"

    Error:
      type: object
      properties:
        code:
          type: integer
        message:
          type: string