openapi: 3.0.0
info:
  title: Брендбук-генератор API
  description: API для онлайн-сервиса генерации брендбуков с помощью ИИ.
  version: 1.0.0

servers:
  - url: http://localhost:8080/api/v1
    description: Локальный сервер разработки

tags:
  - name: Auth
    description: Аутентификация и регистрация
  - name: Users
    description: Пользователи и профили
  - name: Projects
    description: Создание, редактирование и генерация проектов
  - name: Feed
    description: Лента публичных проектов

paths:
  /auth/register:
    post:
      summary: Регистрация нового пользователя
      tags: [ Auth ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Пользователь успешно зарегистрирован
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          description: Ошибка валидации формата данных (email/пароль/никнейм не проходят требования)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
              examples:
                InvalidEmail:
                  summary: Некорректный email
                  value:
                    code: "INVALID_EMAIL"
                    message: "Email is invalid"
                    field: "email"
                InvalidPassword:
                  summary: Пароль не проходит требования
                  value:
                    code: "INVALID_PASSWORD"
                    message: "Password must be 8-128 chars and contain letters and digits"
                    field: "password"
                InvalidNickname:
                  summary: Никнейм не проходит требования
                  value:
                    code: "INVALID_NICKNAME"
                    message: "Nickname must be 3-64 chars"
                    field: "nickname"
        '409':
          description: Конфликт данных (email или nickname уже занят)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
              examples:
                EmailTaken:
                  summary: Email уже занят
                  value:
                    code: "EMAIL_EXISTS"
                    message: "Пользователь с таким email уже зарегистрирован"
                    field: "email"
                NicknameTaken:
                  summary: Никнейм уже занят
                  value:
                    code: "NICKNAME_EXISTS"
                    message: "Этот никнейм уже занят другим пользователем"
                    field: "nickname"
        '500':
          description: Внутренняя ошибка сервера

  /auth/login:
    post:
      summary: Вход в систему (получение токена)
      tags: [ Auth ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Успешный вход
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          description: >
            Неверный email/пароль, одно из полей не передано, либо аккаунт
            зарегистрирован через Yandex ID и пароля у него нет.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthError'
              examples:
                InvalidCredentials:
                  summary: Неверный email или пароль
                  value:
                    code: "INVALID_CREDENTIALS"
                    message: "Invalid email or password"
                NoPasswordSet:
                  summary: Аккаунт создан через Yandex ID, пароля нет
                  value:
                    code: "NO_PASSWORD_SET"
                    message: "This account has no password. Sign in with Yandex ID, or set a password from account settings after signing in."
        '500':
          description: Внутренняя ошибка сервера

  /auth/yandex:
    post:
      summary: Вход/регистрация через Yandex ID
      description: >
        Единая точка входа для обоих Yandex ID флоу — веб (redirect) и
        мобильный/десктопный SDK. Тело запроса — либо {code}, либо
        {access_token}, ровно одно из двух (см. YandexAuthRequest).


        code — веб-флоу: бэкенд сам меняет code на access_token на
        oauth.yandex.ru/token (Basic client_id:client_secret), затем
        забирает профиль через GET login.yandex.ru/info?format=json.


        access_token — SDK-флоу: клиент уже получил финальный access_token
        через нативный Yandex ID SDK, менять его не на что. Бэкенд идёт
        только в GET login.yandex.ru/info?format=jwt — Яндекс отдаёт профиль
        как JWT, подписанный client_secret приложения, и бэкенд проверяет
        подпись/exp локально, без дополнительного похода в oauth.yandex.ru.


        В обоих случаях дальше общая логика: по provider_id/email ищется
        существующий пользователь либо создаётся новый без пароля
        (password_hash = NULL). Если email уже занят другим аккаунтом без
        привязанного provider — см. 409, автолинковки нет намеренно.
      tags: [ Auth ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/YandexAuthRequest'
      responses:
        '200':
          description: Успешный вход (существующий или только что созданный аккаунт)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          description: >
            Не передано ни code, ни access_token, либо Yandex-приложение не
            запросило скоуп login:email и профиль пришёл без email.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
              examples:
                MissingCredential:
                  summary: Не передан ни code, ни access_token
                  value:
                    code: "INVALID_REQUEST"
                    message: "Either code or access_token is required"
                MissingEmailScope:
                  summary: Yandex-приложение не запросило email
                  value:
                    code: "YANDEX_EMAIL_SCOPE_REQUIRED"
                    message: "Yandex ID app must request the login:email scope"
        '409':
          description: >
            Email из профиля Yandex уже принадлежит существующему аккаунту без
            привязанного provider (например, зарегистрированному по паролю).
            Автоматическая привязка намеренно не выполняется — иначе аккаунт
            можно угнать, заранее зарегистрировав чужой email своим паролем.
            Пользователю нужно войти по паролю и привязать Yandex ID явно
            (отдельный флоу, пока не реализован).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
              example:
                code: "EMAIL_EXISTS"
                message: "This email is already registered with a password. Log in with your password and link Yandex ID from account settings."
        '502':
          description: >
            Yandex API недоступен, code невалиден/просрочен, access_token
            невалиден/просрочен/подпись JWT не сходится, либо не удалось
            получить профиль.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
              example:
                code: "YANDEX_OAUTH_FAILED"
                message: "Yandex authentication is temporarily unavailable. Please try again."
        '500':
          description: Внутренняя ошибка сервера

  /auth/method:
    get:
      summary: Способ входа текущего пользователя
      description: >
        Возвращает, есть ли у авторизованного пользователя пароль и привязан
        ли внешний провайдер (сейчас — только Yandex ID). Используется, например,
        чтобы в настройках аккаунта показать "Установить пароль" для пользователей,
        зарегистрированных только через Yandex ID (has_password = false).
      tags: [ Auth ]
      security:
        - BearerAuth: [ ]
      responses:
        '200':
          description: Текущий способ(-ы) входа пользователя
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthMethodResponse'
        '401':
          description: Отсутствует или некорректен JWT
        '404':
          description: Пользователь не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: "USER_NOT_FOUND"
                message: "User not found"
        '500':
          description: Внутренняя ошибка сервера

  /auth/password:
    post:
      summary: Установить или сменить пароль
      description: >
        Если у пользователя ещё нет пароля (аккаунт создан через Yandex ID) —
        current_password передавать не нужно, пароль устанавливается сразу.
        Если пароль уже есть — current_password обязателен и проверяется,
        иначе 400/401.
      tags: [ Auth ]
      security:
        - BearerAuth: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetPasswordRequest'
      responses:
        '200':
          description: Пароль установлен или изменён
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
              examples:
                PasswordSet:
                  summary: Пароля не было (Yandex ID) — установлен впервые
                  value:
                    message: "Password set successfully"
                PasswordChanged:
                  summary: Пароль уже был — заменён на новый
                  value:
                    message: "Password changed successfully"
        '400':
          description: >
            new_password не проходит требования, либо у пользователя уже есть
            пароль, а current_password не передан.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
              examples:
                InvalidPassword:
                  summary: Новый пароль не проходит требования
                  value:
                    code: "INVALID_PASSWORD"
                    message: "Password must be 8-128 chars and contain letters and digits"
                    field: "new_password"
                CurrentPasswordRequired:
                  summary: У пользователя уже есть пароль, но current_password не передан
                  value:
                    code: "CURRENT_PASSWORD_REQUIRED"
                    message: "Current password is required to change an existing password"
                    field: "current_password"
        '401':
          description: >
            Отсутствует/некорректен JWT, либо (если пароль уже был) неверный
            current_password.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
              example:
                code: "INVALID_CURRENT_PASSWORD"
                message: "Current password is incorrect"
                field: "current_password"
        '404':
          description: Пользователь не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: "USER_NOT_FOUND"
                message: "User not found"
        '500':
          description: Внутренняя ошибка сервера

  /users/{id}:
    get:
      summary: Получить профиль пользователя
      tags: [ Users ]
      security:
        - BearerAuth: [ ]
        - { }
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            example: "123e4567-e89b-12d3-a456-426614174000"
      responses:
        '200':
          description: Профиль пользователя
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/UserProfile'
                  - type: object
                    properties:
                      projects:
                        type: array
                        items:
                          $ref: '#/components/schemas/Project'
        '400':
          description: Некорректный UUID пользователя
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: "INVALID_UUID"
                message: "Некорректный формат ID пользователя"
        '404':
          description: Пользователь не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: "USER_NOT_FOUND"
                message: "Пользователь не найден"

    patch:
      summary: Обновить nickname пользователя
      description: Пользователь может изменить nickname только собственного профиля.
      tags: [ Users ]
      security:
        - BearerAuth: [ ]
      parameters:
        - name: id
          in: path
          required: true
          description: Идентификатор пользователя
          schema:
            type: string
            example: "123e4567-e89b-12d3-a456-426614174000"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserProfileRequest'
      responses:
        '200':
          description: Nickname успешно обновлён
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateUserProfileResponse'
        '400':
          description: Некорректный UUID или nickname
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        '401':
          description: Отсутствует или некорректен JWT
        '403':
          description: Попытка изменить чужой профиль
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Пользователь не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Nickname уже занят другим пользователем
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'

  /users/{id}/subscribe:
    post:
      summary: Подписаться на пользователя
      tags: [ Users ]
      security:
        - BearerAuth: [ ]
      parameters:
        - name: id
          in: path
          required: true
          description: Идентификатор пользователя, на которого оформляется подписка
          schema:
            type: string
            example: "123e4567-e89b-12d3-a456-426614174000"
      responses:
        '200':
          description: Подписка успешно оформлена (в т.ч. повторно — операция идемпотентна)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
              example:
                message: "Subscribed successfully"
        '400':
          description: Нельзя подписаться на самого себя
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
              example:
                message: "Cannot subscribe to yourself"
        '401':
          description: Отсутствует или некорректен JWT
        '404':
          description: Пользователь, на которого оформляется подписка, не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
              example:
                message: "User not found"
        '500':
          description: Внутренняя ошибка сервера

    delete:
      summary: Отписаться от пользователя
      tags: [ Users ]
      security:
        - BearerAuth: [ ]
      parameters:
        - name: id
          in: path
          required: true
          description: Идентификатор пользователя, от которого отписываются
          schema:
            type: string
            example: "123e4567-e89b-12d3-a456-426614174000"
      responses:
        '200':
          description: >
            Подписка успешно отменена. Операция ничего не проверяет, кроме
            авторизации — сработает 200, даже если подписки не было или
            пользователь id не существует.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
              example:
                message: "Unsubscribed successfully"
        '401':
          description: Отсутствует или некорректен JWT
        '500':
          description: Внутренняя ошибка сервера

  /users/{id}/subscribers:
    get:
      summary: Получить список всех подписчиков пользователя
      tags: [ Users ]
      security:
        - BearerAuth: [ ]
        - { }
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Список пользователей-подписчиков
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                      example: "123e4567-e89b-12d3-a456-426614174000"
                    name:
                      type: string
                      example: "John Doe"
                    is_subscribed:
                      type: boolean
                      description: "Подписан ли авторизованный пользователь на этого человека"
                      example: false
        '400':
          description: Некорректный формат ID
        '404':
          description: Пользователь не найден

  /users/{id}/subscriptions:
    get:
      summary: Получить список всех подписок пользователя
      tags: [ Users ]
      security:
        - BearerAuth: [ ]
        - { }
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Список профилей пользователей, на которых подписан текущий
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                      example: "123e4567-e89b-12d3-a456-426614174000"
                    name:
                      type: string
                      example: "John Doe"
                    is_subscribed:
                      type: boolean
                      description: "Подписан ли авторизованный пользователь на этого человека"
                      example: false
        '400':
          description: Некорректный формат ID
        '404':
          description: Пользователь не найден

  /projects:
    post:
      summary: Создать новый проект
      tags: [ Projects ]
      security:
        - BearerAuth: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
              properties:
                name:
                  type: string
                  example: "Бренд кофейни"
                description:
                  type: string
                  example: "Минималистичный стиль, темные тона, для спешелти кофейни"
      responses:
        '201':
          description: Проект создан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '400':
          description: Не передано название проекта (name)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
              example:
                message: "Name is required"
        '401':
          description: Отсутствует или некорректен JWT
        '500':
          description: Внутренняя ошибка сервера

  /projects/{id}:
    get:
      summary: Получить проект по ID
      tags: [ Projects ]
      security:
        - BearerAuth: [ ]
        - { }
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Данные проекта
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '401':
          description: Проект приватный, а запрос анонимный (без JWT)
        '403':
          description: >
            Проект приватный, и вы авторизованы, но не автор проекта.
            Также этим кодом отвечает auth-мидлварь, если сам JWT
            невалиден/просрочен (в таком случае наличие прав уже не проверяется).
        '404':
          description: Проект не найден
        '500':
          description: Внутренняя ошибка сервера

    patch:
      summary: Обновить данные проекта (ручное сохранение)
      tags: [ Projects ]
      security:
        - BearerAuth: [ ]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 255
                  description: Новое название проекта
                  example: "Новое название проекта"
                is_public:
                  type: boolean
                data:
                  type: string
                  description: "Чистая SVG-разметка проекта"
                  example: '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500"><g></g></svg>'
      responses:
        '200':
          description: Проект успешно обновлён. Возвращает полный объект проекта после изменений.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '401':
          description: Отсутствует или некорректен JWT
        '403':
          description: >
            Вы авторизованы, но не автор проекта. Также этим кодом отвечает
            auth-мидлварь при невалидном/просроченном JWT.
        '404':
          description: Проект не найден
        '400':
          description: Название проекта пустое или превышает 255 символов
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        '500':
          description: Внутренняя ошибка сервера

    delete:
      summary: Удаление проекта
      tags: [ Projects ]
      security:
        - BearerAuth: [ ]
      parameters:
        - name: id
          in: path
          required: true
          description: Уникальный идентификатор проекта
          schema:
            type: string
      responses:
        '200':
          description: Проект удалён
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
              example:
                message: "Project deleted successfully"
        '401':
          description: Отсутствует или некорректен JWT
        '403':
          description: Нет прав на удаление чужого проекта
        '404':
          description: Проект не найден
        '500':
          description: Внутренняя ошибка сервера

  /projects/{id}/generate:
    post:
      summary: Запуск генерации/правки проекта с помощью ИИ (асинхронно)
      description: >
        Запускает в фоне генерацию (если у проекта ещё нет версий) либо правку
        (иначе) SVG по запросу пользователя — сам запрос не ждёт завершения
        обращения к LLM и сразу отвечает job_id. В промпт модели автоматически
        подмешивается история последних 10 предыдущих запросов пользователя по
        этому же проекту (без ответов модели) — как контекст, не как повторное
        задание. Сообщение пользователя добавляется в историю чата проекта
        (GET /projects/{id}/chat) немедленно, синхронно с этим запросом —
        независимо от того, чем закончится сама генерация. Результат (или
        ошибку) генерации нужно опрашивать через
        GET /projects/{id}/generate/{job_id}.
      tags: [ Projects ]
      security:
        - BearerAuth: [ ]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - prompt
              properties:
                prompt:
                  type: string
                  example: "Добавь логотип с изображением кружки"
                model:
                  type: string
                  example: "deepseek-v4-flash/latest"
      responses:
        '202':
          description: >
            Генерация запущена в фоне. Дальнейший статус — через
            GET /projects/{id}/generate/{job_id}.
          content:
            application/json:
              schema:
                type: object
                properties:
                  job_id:
                    type: string
                    description: Идентификатор фоновой задачи генерации.
                    example: "b3d9f2b0-6e3a-4b1a-9f0c-2b7b9a2d9c11"
        '400':
          description: Не передан prompt, либо prompt длиннее 1500 символов
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
              example:
                message: "Prompt cannot be empty"
        '401':
          description: Не авторизован
        '403':
          description: Нет прав на генерацию в чужом проекте
        '404':
          description: Проект не найден

  /projects/{id}/generate/{job_id}:
    get:
      summary: Статус фоновой задачи генерации (long polling)
      description: >
        Опрос результата задачи, запущенной POST /projects/{id}/generate.
        Запрос "подвисает" на сервере до ~25 секунд, ожидая завершения
        генерации (long polling) — если за это время задача не завершилась,
        возвращается status="pending" и клиенту следует повторить запрос ещё
        раз. Состояние задачи хранится в памяти процесса бэкенда и не
        переживает его перезапуск.
      tags: [ Projects ]
      security:
        - BearerAuth: [ ]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: job_id
          in: path
          required: true
          description: Идентификатор задачи, полученный из ответа POST .../generate
          schema:
            type: string
      responses:
        '200':
          description: Текущий статус задачи генерации
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenerationStatus'
              examples:
                Pending:
                  summary: Ещё выполняется (таймаут long-poll'а истёк)
                  value:
                    status: "pending"
                Done:
                  summary: Готово
                  value:
                    status: "done"
                    url: "https://s3.yandexcloud.net/bucket/project_version.svg"
                Error:
                  summary: Генерация упала (например, LLM вернул невалидный SVG)
                  value:
                    status: "error"
                    message: "Generation service is temporarily unavailable. Please try again later."
        '401':
          description: Не авторизован
        '403':
          description: Нет прав на просмотр генерации в чужом проекте
        '404':
          description: Проект не найден, либо job_id не существует / не принадлежит этому проекту

  /projects/{id}/versions:
    get:
      summary: Список версий проекта
      description: >
        История версий проекта. Доступна только автору проекта — даже если проект
        публичный (публичность открывает только текущую версию через /projects/{id},
        но не историю). Отсортировано по version_num по убыванию (сначала новые).
      tags: [ Projects ]
      security:
        - BearerAuth: [ ]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Список версий проекта
          content:
            application/json:
              schema:
                type: object
                properties:
                  versions:
                    type: array
                    items:
                      $ref: '#/components/schemas/VersionInfo'
        '401':
          description: Отсутствует или некорректен JWT (анонимный запрос)
        '403':
          description: >
            Вы авторизованы, но не автор проекта. История приватна независимо от
            публичности проекта. Также этим кодом отвечает auth-мидлварь при
            невалидном/просроченном JWT.
        '404':
          description: Проект не найден
        '500':
          description: Внутренняя ошибка сервера

  /projects/{id}/versions/{version_id}:
    get:
      summary: Получить ссылку на конкретную версию
      description: >
        Возвращает временную (presigned) ссылку на объект выбранной версии для
        просмотра. Только для автора проекта. Запрос ограничен парой project_id +
        version_id, поэтому версию из чужого проекта получить нельзя (будет 404).
      tags: [ Projects ]
      security:
        - BearerAuth: [ ]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: version_id
          in: path
          required: true
          description: Идентификатор версии (UUID), из поля id ответа /versions
          schema:
            type: string
      responses:
        '200':
          description: Ссылка на объект версии
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VersionUrl'
        '401':
          description: Отсутствует или некорректен JWT
        '403':
          description: Вы авторизованы, но не автор проекта (или невалидный JWT)
        '404':
          description: Проект не найден, либо версия не существует / не принадлежит этому проекту
        '500':
          description: Внутренняя ошибка сервера

  /projects/{id}/versions/{version_id}/restore:
    post:
      summary: Откатить проект к выбранной версии
      description: >
        Сохраняет содержимое выбранной версии как НОВУЮ последнюю версию проекта
        (неразрушающий откат — промежуточная история сохраняется). ACL новой версии
        выставляется по текущей видимости проекта. Только для автора. Тела запроса нет.
      tags: [ Projects ]
      security:
        - BearerAuth: [ ]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: version_id
          in: path
          required: true
          description: Идентификатор версии (UUID), к которой откатываемся
          schema:
            type: string
      responses:
        '200':
          description: >
            Откат выполнен. Возвращает id созданной новой версии и свежую ссылку
            на неё, чтобы фронт мог сразу её отрисовать.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VersionUrl'
        '401':
          description: Отсутствует или некорректен JWT
        '403':
          description: Вы авторизованы, но не автор проекта (или невалидный JWT)
        '404':
          description: Проект не найден, либо версия не существует / не принадлежит этому проекту
        '500':
          description: Внутренняя ошибка сервера

  /projects/{id}/chat:
    get:
      summary: История чата проекта
      description: >
        Возвращает всю историю запросов пользователя и ответов ассистента по
        проекту, в порядке добавления. Доступна только автору проекта — даже
        если проект публичный (публичность открывает только текущую версию
        через /projects/{id}, но не историю чата — так же, как и с
        /projects/{id}/versions). Ответы ассистента отдаются не самим SVG и не
        прямой ссылкой (та имеет срок годности), а идентификатором версии —
        фронт/мобилка сверяются со своим локальным кэшем по version_id (он
        совпадает с id из GET /projects/{id}/versions) и только при промахе
        кэша идут за свежей ссылкой в GET /projects/{id}/versions/{version_id}.
      tags: [ Projects ]
      security:
        - BearerAuth: [ ]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: История чата проекта
          content:
            application/json:
              schema:
                type: object
                properties:
                  chat_history:
                    type: array
                    items:
                      $ref: '#/components/schemas/ChatMessage'
        '401':
          description: Отсутствует или некорректен JWT
        '403':
          description: Вы авторизованы, но не автор проекта
        '404':
          description: Проект не найден

  /models:
    get:
      summary: Получение списка доступных ИИ-моделей
      description: Возвращает список всех языковых и других ИИ-моделей (Yandex, DeepSeek, OpenAI и др.), доступных для использования в сервисе. Формат ответа совместим с OpenAI API.
      tags:
        - Models
      responses:
        '200':
          description: Успешный запрос. Возвращает объект со списком моделей.
          content:
            application/json:
              schema:
                type: object
                required:
                  - object
                  - data
                properties:
                  object:
                    type: string
                    example: "list"
                    description: Тип корневого объекта.
                  data:
                    type: array
                    description: Массив доступных моделей.
                    items:
                      type: object
                      required:
                        - id
                        - object
                        - owned_by
                        - created
                      properties:
                        id:
                          type: string
                          example: "gpt://b1gttnvmtpd0tagdlb7o/deepseek-v4-flash/latest"
                          description: Уникальный идентификатор (URI) модели.
                        object:
                          type: string
                          example: "model"
                          description: Тип сущности элемента массива.
                        owned_by:
                          type: string
                          example: "Yandex"
                          description: Владелец или разработчик модели (Yandex, DeepSeek, OpenAI, Alibaba).
                        created:
                          type: integer
                          example: 0
                          description: Временная метка создания модели (Unix timestamp).

  /feed:
    get:
      summary: Лента публичных проектов
      description: >
        Возвращает страницу публичных проектов, отсортированных по дате создания
        (сначала новые). Курсорная пагинация — для следующей страницы нужно
        передать next_cursor из предыдущего ответа, а не увеличивать offset.
      tags: [ Feed ]
      security:
        - BearerAuth: [ ]
        - { }
      parameters:
        - name: scope
          in: query
          required: false
          description: >
            discover — все публичные проекты всех пользователей.
            following — только проекты авторов, на которых подписан текущий
            пользователь (требует авторизации).
          schema:
            type: string
            enum: [ discover, following ]
            default: discover
        - name: cursor
          in: query
          required: false
          description: Значение next_cursor из предыдущего ответа. Если не передан — отдаётся первая страница.
          schema:
            type: string
            example: "2026-08-14T10:00:00.123456+00:00|3fa85f64-5717-4562-b3fc-2c963f66afa6"
        - name: limit
          in: query
          required: false
          description: Размер страницы. Значения вне диапазона обрезаются сервером.
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
      responses:
        '200':
          description: Страница ленты
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeedResponse'
        '400':
          description: Некорректное значение scope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: scope=following без авторизации

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    RegisterRequest:
      type: object
      required:
        - email
        - password
        - nickname
      properties:
        email:
          type: string
          format: email
          maxLength: 128
          example: "user@example.com"
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 128
          description: "8-128 символов, обязательно хотя бы одна буква и одна цифра"
          example: "strongPassword123!"
        nickname:
          type: string
          minLength: 3
          maxLength: 64
          example: "John Doe"

    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          example: "user@example.com"
        password:
          type: string
          format: password
          example: "StrongPassword123!"

    YandexAuthRequest:
      description: >
        Ровно одно из полей: code — веб-флоу (redirect), access_token —
        SDK-флоу (мобильный/десктопный нативный Yandex ID SDK).
      oneOf:
        - type: object
          required: [ code ]
          properties:
            code:
              type: string
              description: Authorization code, полученный фронтом после редиректа с oauth.yandex.ru/authorize
              example: "7677812"
        - type: object
          required: [ access_token ]
          properties:
            access_token:
              type: string
              description: >
                Финальный OAuth-токен, полученный нативным Yandex ID SDK.
                Бэкенд не меняет его на другой — идёт напрямую в
                login.yandex.ru/info?format=jwt.
              example: "y0_AgAAAAAB1234..."

    AuthMethodResponse:
      type: object
      required:
        - has_password
        - provider
      properties:
        has_password:
          type: boolean
          description: Можно ли войти по email+паролю (POST /auth/login)
          example: false
        provider:
          type: string
          nullable: true
          description: Привязанный внешний провайдер, либо null, если ни один не привязан
          enum: [ yandex, null ]
          example: "yandex"

    SetPasswordRequest:
      type: object
      required:
        - new_password
      properties:
        current_password:
          type: string
          format: password
          description: Обязателен, только если у пользователя уже есть пароль
          example: "oldPassword123"
        new_password:
          type: string
          format: password
          minLength: 8
          maxLength: 128
          description: "8-128 символов, обязательно хотя бы одна буква и одна цифра"
          example: "newStrongPassword456"

    AuthResponse:
      type: object
      required:
        - access_token
        - token_type
        - user
      properties:
        access_token:
          type: string
          example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
        token_type:
          type: string
          example: "Bearer"
        user:
          type: object
          required:
            - id
            - email
            - nickname
          properties:
            id:
              type: string
              example: "123e4567-e89b-12d3-a456-426614174000"
            email:
              type: string
              format: email
              example: "user@example.com"
            nickname:
              type: string
              example: "John Doe"

    UserProfile:
      type: object
      properties:
        id:
          type: string
          example: "123e4567-e89b-12d3-a456-426614174000"
        name:
          type: string
          example: "John Doe"
        subscribers_count:
          type: integer
          example: 2
        subscriptions_count:
          type: integer
          example: 1
        is_subscribed:
          type: boolean
          description: "Подписан ли текущий авторизованный пользователь на этого пользователя. Отсутствует при запросе собственного профиля."
          example: true

    UpdateUserProfileRequest:
      type: object
      required:
        - nickname
      properties:
        nickname:
          type: string
          minLength: 3
          maxLength: 64
          description: Новый уникальный nickname пользователя
          example: "new_nickname"

    UpdateUserProfileResponse:
      type: object
      required:
        - id
        - nickname
      properties:
        id:
          type: string
          example: "123e4567-e89b-12d3-a456-426614174000"
        nickname:
          type: string
          example: "new_nickname"

    Project:
      type: object
      properties:
        id:
          type: string
          example: "123e4567-e89b-12d3-a456-426614174000"
        author_id:
          type: string
          example: "123e4567-e89b-12d3-a456-426614174000"
        name:
          type: string
          example: "Бренд кофейни"
        description:
          type: string
          example: "Минималистичный стиль"
        is_public:
          type: boolean
          example: false
        created_at:
          type: string
          format: date-time
        url:
          type: string
          description: "S3 ссылка на объект проекта (отсутствует, если проект пуст)"
          example: "https://s3.yandexcloud.net/bucket/project_version.svg"

    FeedResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/FeedItem'
        next_cursor:
          type: string
          description: Курсор для запроса следующей страницы. Отсутствует, если страница последняя.
          example: "2026-08-14T10:00:00.123456+00:00|3fa85f64-5717-4562-b3fc-2c963f66afa6"

    FeedItem:
      type: object
      properties:
        id:
          type: string
          description: Идентификатор проекта
        author_id:
          type: string
        author_login:
          type: string
        name:
          type: string
        created_at:
          type: string
          format: date-time
        preview_url:
          type: string
          description: Ссылка на превью последней версии проекта. Пустая строка, если превью ещё не сгенерировано.

    ValidationError:
      type: object
      properties:
        code:
          type: string
          example: "EMAIL_EXISTS"
        message:
          type: string
          example: "Пользователь с таким email уже зарегистрирован"
        field:
          type: string
          example: "email"

    MessageResponse:
      type: object
      description: Простой ответ вида "успех/ошибка одной строкой", без кода ошибки — используется там, где хендлер не различает конкретные причины сбоя.
      properties:
        message:
          type: string
          example: "Project deleted successfully"

    AuthError:
      type: object
      description: Ошибка аутентификации при входе — код всегда один и тот же, не различает "нет такого email" от "неверный пароль" (чтобы не палить существование email).
      properties:
        code:
          type: string
          example: "INVALID_CREDENTIALS"
        message:
          type: string
          example: "Invalid email or password"

    Error:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
    VersionInfo:
      type: object
      description: Метаданные одной версии проекта (без ключей объектного хранилища).
      properties:
        id:
          type: string
          description: Идентификатор версии (UUID). Используется в /versions/{version_id}.
          example: "5a4e8657-151f-4088-a660-ac99b15994b7"
        version_num:
          type: integer
          description: Порядковый номер версии в рамках проекта.
          example: 3
        created_at:
          type: string
          format: date-time
          example: "2026-08-15T00:01:55.123456+00:00"


    ChatMessage:
      type: object
      description: >
        Одно сообщение в истории чата проекта. Пользовательские сообщения
        несут текст запроса (text), сообщения ассистента — либо идентификатор
        созданной версии (version_id), либо, если генерация упала, текст
        ошибки (error) — вместо самого SVG или ссылки на него. Сообщение
        пользователя и ответ ассистента одного обмена связаны общим job_id
        (идентификатором фоновой задачи генерации из POST .../generate);
        пользовательское сообщение появляется в истории сразу при старте
        задачи, ответ ассистента — только после её завершения.
      required:
        - role
        - created_at
      properties:
        role:
          type: string
          enum: [ user, assistant ]
        text:
          type: string
          description: "Только для role=user — текст запроса пользователя"
          example: "Добавь логотип с изображением кружки"
        version_id:
          type: string
          description: "Только для role=assistant при успешной генерации — id созданной версии проекта"
          example: "5a4e8657-151f-4088-a660-ac99b15994b7"
        error:
          type: string
          description: "Только для role=assistant при неудачной генерации — текст ошибки"
          example: "Generation service is temporarily unavailable. Please try again later."
        job_id:
          type: string
          description: Идентификатор фоновой задачи генерации, к которой относится сообщение.
          example: "b3d9f2b0-6e3a-4b1a-9f0c-2b7b9a2d9c11"
        created_at:
          type: string
          format: date-time

    GenerationStatus:
      type: object
      description: Текущее состояние фоновой задачи генерации.
      required:
        - status
      properties:
        status:
          type: string
          enum: [ pending, done, error ]
        url:
          type: string
          description: "Только при status=done — presigned-ссылка на сгенерированный SVG-объект"
          example: "https://s3.yandexcloud.net/bucket/project_version.svg"
        message:
          type: string
          description: "Только при status=error — текст ошибки"
          example: "Generation service is temporarily unavailable. Please try again later."

    VersionUrl:
      type: object
      description: >
        Ответ с id версии и ссылкой на её объект. У /versions/{version_id} это
        просмотр выбранной версии; у /restore — новая (созданная откатом) версия.
      properties:
        version_id:
          type: string
          example: "5a4e8657-151f-4088-a660-ac99b15994b7"
        url:
