openapi: 3.0.0
info:
  title: Брендбук-генератор API
  description: API для онлайн-сервиса генерации брендбуков с помощью ИИ.
  version: 1.0.0

servers:
  - url: http://localhost:8080/api/v1
    description: Локальный сервер разработки

tags:
  - name: Auth
    description: Аутентификация и регистрация
  - name: Users
    description: Пользователи и профили
  - name: Projects
    description: Создание, редактирование и генерация проектов

paths:
  /auth/register:
    post:
      summary: Регистрация нового пользователя
      tags: [ Auth ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Пользователь успешно зарегистрирован
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          description: Ошибка валидации формата данных (неверный email, короткий пароль и т.д.)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
              examples:
                InvalidEmail:
                  summary: Невалидный email
                  value:
                    code: "INVALID_EMAIL"
                    message: "Некорректный формат email"
                WeakPassword:
                  summary: Слабый пароль
                  value:
                    code: "INVALID_PASSWORD"
                    message: "Пароль слишком простой"
                ShortNickname:
                  summary: Короткий никнейм
                  value:
                    code: "INVALID_NICKNAME"
                    message: "Никнейм должен содержать минимум 3 символа"
        '409':
          description: Конфликт данных (email или nickname уже занят)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
              examples:
                EmailTaken:
                  summary: Email уже занят
                  value:
                    code: "EMAIL_EXISTS"
                    message: "Пользователь с таким email уже зарегистрирован"
                    field: "email"
                NicknameTaken:
                  summary: Никнейм уже занят
                  value:
                    code: "NICKNAME_EXISTS"
                    message: "Этот никнейм уже занят другим пользователем"
                    field: "nickname"

  /auth/login:
    post:
      summary: Вход в систему (получение токена)
      tags: [ Auth ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Успешный вход
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          description: Неверные учетные данные или пустой пароль
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: "INVALID_CREDENTIALS"
                message: "Неверный email или пароль"

  /users/{id}:
    get:
      summary: Получить профиль пользователя
      tags: [ Users ]
      security:
        - BearerAuth: [ ]
        - { }
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            example: "123e4567-e89b-12d3-a456-426614174000"
      responses:
        '200':
          description: Профиль пользователя
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/UserProfile'
                  - type: object
                    properties:
                      projects:
                        type: array
                        items:
                          $ref: '#/components/schemas/ProjectDescription'
        '400':
          description: Некорректный UUID пользователя
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: "INVALID_UUID"
                message: "Некорректный формат ID пользователя"
        '404':
          description: Пользователь не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: "USER_NOT_FOUND"
                message: "Пользователь не найден"

  /users/{id}/subscribe:
    post:
      summary: Подписаться на пользователя
      tags: [ Users ]
      security:
        - BearerAuth: [ ]
      parameters:
        - name: id
          in: path
          required: true
          description: Идентификатор пользователя, на которого оформляется подписка
          schema:
            type: string
            example: "123e4567-e89b-12d3-a456-426614174000"
      responses:
        '200':
          description: Подписка успешно оформлена
        '400':
          description: Нельзя подписаться на самого себя
        '401':
          description: Не авторизован
        '404':
          description: Пользователь не найден

    delete:
      summary: Отписаться от пользователя
      tags: [ Users ]
      security:
        - BearerAuth: [ ]
      parameters:
        - name: id
          in: path
          required: true
          description: Идентификатор пользователя, от которого отписываются
          schema:
            type: string
            example: "123e4567-e89b-12d3-a456-426614174000"
      responses:
        '200':
          description: Подписка успешно отменена
        '401':
          description: Не авторизован

  /users/{id}/subscribers:
    get:
      summary: Получить список всех подписчиков пользователя
      tags: [ Users ]
      security:
        - BearerAuth: [ ]
        - { }
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Список пользователей-подписчиков
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                      example: "123e4567-e89b-12d3-a456-426614174000"
                    name:
                      type: string
                      example: "John Doe"
                    is_subscribed:
                      type: boolean
                      description: "Подписан ли авторизованный пользователь на этого человека"
                      example: false
        '400':
          description: Некорректный формат ID
        '404':
          description: Пользователь не найден

  /users/{id}/subscriptions:
    get:
      summary: Получить список всех подписок пользователя
      tags: [ Users ]
      security:
        - BearerAuth: [ ]
        - { }
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Список профилей пользователей, на которых подписан текущий
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                      example: "123e4567-e89b-12d3-a456-426614174000"
                    name:
                      type: string
                      example: "John Doe"
                    is_subscribed:
                      type: boolean
                      description: "Подписан ли авторизованный пользователь на этого человека"
                      example: false
        '400':
          description: Некорректный формат ID
        '404':
          description: Пользователь не найден

  /projects:
    post:
      summary: Создать новый проект
      tags: [ Projects ]
      security:
        - BearerAuth: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
              properties:
                name:
                  type: string
                  example: "Бренд кофейни"
                description:
                  type: string
                  example: "Минималистичный стиль, темные тона, для спешелти кофейни"
      responses:
        '201':
          description: Проект создан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '401':
          description: Не авторизован

  /projects/{id}:
    get:
      summary: Получить проект по ID
      tags: [ Projects ]
      security:
        - BearerAuth: [ ]
        - { }
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Данные проекта
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '403':
          description: Нет прав (не автор проекта)
        '404':
          description: Проект не найден

    patch:
      summary: Обновить данные проекта (ручное сохранение)
      tags: [ Projects ]
      security:
        - BearerAuth: [ ]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                is_public:
                  type: boolean
                data:
                  type: string
                  description: "Чистая SVG-разметка проекта"
                  example: '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500"><g></g></svg>'
      responses:
        '200':
          description: Проект успешно обновлен
        '401':
          description: Не авторизован
        '403':
          description: Нет прав (не автор проекта)

    delete:
      summary: Удаление проекта
      tags: [ Projects ]
      security:
        - BearerAuth: [ ]
      parameters:
        - name: id
          in: path
          required: true
          description: Уникальный идентификатор проекта
          schema:
            type: string
      responses:
        '200':
          description: Проект удалён
        '401':
          description: Не авторизован
        '403':
          description: Нет прав на удаление чужого проекта
        '404':
          description: Проект не найден

  /projects/{id}/generate:
    post:
      summary: Изменение/генерация проекта с помощью ИИ
      tags: [ Projects ]
      security:
        - BearerAuth: [ ]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - prompt
              properties:
                prompt:
                  type: string
                  example: "Добавь логотип с изображением кружки"
      responses:
        '200':
          description: Сгенерированный SVG-код проекта
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: string
                    description: "Результат работы нейросети в виде SVG-строки"
                    example: '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500"><circle cx="250" cy="250" r="100" fill="#FF0000"/></svg>'
        '401':
          description: Не авторизован
        '403':
          description: Нет прав на генерацию в чужом проекте

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    RegisterRequest:
      type: object
      required:
        - email
        - password
        - nickname
      properties:
        email:
          type: string
          format: email
          example: "user@example.com"
        password:
          type: string
          format: password
          example: "StrongPassword123!"
        nickname:
          type: string
          example: "John Doe"

    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          example: "user@example.com"
        password:
          type: string
          format: password
          example: "StrongPassword123!"

    AuthResponse:
      type: object
      required:
        - access_token
        - token_type
        - user
      properties:
        access_token:
          type: string
          example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
        token_type:
          type: string
          example: "Bearer"
        user:
          type: object
          required:
            - id
            - email
            - nickname
          properties:
            id:
              type: string
              example: "123e4567-e89b-12d3-a456-426614174000"
            email:
              type: string
              format: email
              example: "user@example.com"
            nickname:
              type: string
              example: "John Doe"

    UserProfile:
      type: object
      properties:
        id:
          type: string
          example: "123e4567-e89b-12d3-a456-426614174000"
        name:
          type: string
          example: "John Doe"
        subscribers_count:
          type: integer
          example: 2
        subscriptions_count:
          type: integer
          example: 1
        is_subscribed:
          type: boolean
          description: "Подписан ли текущий авторизованный пользователь на этого пользователя. Отсутствует при запросе собственного профиля."
          example: true

    Project:
      allOf:
        - $ref: '#/components/schemas/ProjectDescription'
        - type: object
          properties:
            data:
              type: string
              example: '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500"><circle cx="250" cy="250" r="100"/></svg>'

    ProjectDescription:
      type: object
      properties:
        id:
          type: string
          example: "123e4567-e89b-12d3-a456-426614174000"
        author_id:
          type: string
          example: "123e4567-e89b-12d3-a456-426614174000"
        name:
          type: string
          example: "Бренд кофейни"
        description:
          type: string
          example: "Минималистичный стиль"
        is_public:
          type: boolean
          example: false
        created_at:
          type: string
          format: date-time

    ValidationError:
      type: object
      properties:
        code:
          type: string
          example: "EMAIL_EXISTS"
        message:
          type: string
          example: "Пользователь с таким email уже зарегистрирован"
        field:
          type: string
          example: "email"

    Error:
      type: object
      properties:
        code:
          type: string
          example: "INVALID_CREDENTIALS"
        message:
          type: string
          example: "Неверный email или пароль"