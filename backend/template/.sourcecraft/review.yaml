# PR домашки НЕ мержится: балл ставит автопроверка (коммент в PR) или ревьюер
# через submit-grade. Ставим заведомо недостижимое число аппрувов, чтобы случайный
# мёрж не залил домашку в main (иначе следующая ДЗ перетрёт предыдущую и останутся артефакты).
codereview:
  need_ships: 100
  ignore_self_ship: true
  disallow_force_merge: true
