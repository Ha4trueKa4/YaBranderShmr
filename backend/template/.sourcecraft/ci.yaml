# CI шаблона студента (трек C++). Один репо на студента, ДЗ — ветки.
# TASK_SLUG берётся из имени head-ветки (= slug задания). SCHOOL фиксирован на трек.
#
# Проверка идёт на PR из <task> в <task>_solution (базовая ветка содержит "_solution"),
# чтобы в диффе ревью было видно только решение студента, а не весь каркас на фоне main.
#
# Роутинг по типу ДЗ (имя ветки = SOURCECRAFT_COMMIT_REF_NAME):
#   - авто-проверяемые ДЗ  -> зовём центральную check-homework-cpp (mvnw/make test, балл).
#   - кросс-проверочные ДЗ -> авто-проверка пропускается (if), оценка ставится
#     ревьюером через submit-grade. Список кросс-онли держим в CROSS_REVIEW_ONLY ниже.
#     Сейчас кросс-онли: cpp-architecture (архитектура кода — оценивается ревью).

workflows:
  check-pr:
    tasks:
      - name: check
        cubes:
          - name: setup
            script:
              - |
                echo "WORKFLOW_VALUES=[{\"name\": \"STUDENT_REPO_URL\", \"value\": \"${SOURCECRAFT_REPO_URL}\"}, {\"name\": \"PR_SLUG\", \"value\": \"${SOURCECRAFT_PR_SLUG}\"}, {\"name\": \"STUDENT_COMMIT_SHA\", \"value\": \"${SOURCECRAFT_COMMIT_SHA}\"}, {\"name\": \"TASK_SLUG\", \"value\": \"${SOURCECRAFT_COMMIT_REF_NAME}\"}, {\"name\": \"SCHOOL\", \"value\": \"shbr-cpp\"}]" >> $SOURCECRAFT_ENV

          # Кросс-онли ДЗ: автотестов нет, оценка — ревью однокурсников + ментор.
          - name: cross-review-note
            if: env.SOURCECRAFT_COMMIT_REF_NAME == "cpp-architecture" && contains(env.SOURCECRAFT_BASE_REF, "_solution")
            script:
              - echo "Эта ДЗ оценивается кросс-проверкой (ревью + ментор), автотестов нет. Балл ставит ревьюер через submit-grade."

          # БД-ДЗ (индексы) — Python/FastAPI стек (общий check-homework-db).
          - name: run-db
            if: env.SOURCECRAFT_COMMIT_REF_NAME == "cpp-database-task" && contains(env.SOURCECRAFT_BASE_REF, "_solution")
            image: cr.yandex/sourcecraft/cubes/shared-workflows:latest
            env:
              ORG_SLUG: ya-schools-summer
              REPO_SLUG: shbr-internal-automations
              WORKFLOW_NAME: check-homework-db
              TASK_NAME: check
              CUBE_NAME: run-tests
              ARTIFACT_LOCAL_PATH: score.json
            artifacts:
              paths:
                - artifacts/output

          # Остальные C++-ДЗ (userver) — кроме кросс-онли и БД.
          - name: run-userver
            if: env.SOURCECRAFT_COMMIT_REF_NAME != "cpp-architecture" && env.SOURCECRAFT_COMMIT_REF_NAME != "cpp-database-task" && contains(env.SOURCECRAFT_BASE_REF, "_solution")
            image: cr.yandex/sourcecraft/cubes/shared-workflows:latest
            env:
              ORG_SLUG: ya-schools-summer
              REPO_SLUG: shbr-internal-automations
              WORKFLOW_NAME: check-homework-cpp
              TASK_NAME: check
              CUBE_NAME: run-tests
              ARTIFACT_LOCAL_PATH: score.json
            artifacts:
              paths:
                - artifacts/output

          # Печать результата — некритичный шаг: если артефакта нет (проверка
          # не доехала), не валим весь workflow (иначе PR показывает ошибку).
          - name: show-result
            if: env.SOURCECRAFT_COMMIT_REF_NAME != "cpp-architecture" && contains(env.SOURCECRAFT_BASE_REF, "_solution")
            allow_failure: true
            image: python:3.11-slim
            script:
              - |
                python3 - << 'EOF'
                import json
                try:
                    with open('artifacts/output') as f:
                        result = json.load(f)
                    print(f"Score:  {result['score']}/100")
                    print(f"Detail: {result['detail']}")
                except Exception as e:
                    print(f"нет результата автопроверки (не критично): {e}")
                EOF

  # Кросс-проверка. Ревьюер запускает ЭТОТ workflow вручную из репо студента,
  # которого ему назначили проверять, выбрав ветку нужной ДЗ. Балл уходит в
  # shared submit-grade автоматизаций (TASK_SLUG = имя ветки, репо = текущий).
  submit-grade:
    inputs:
      GRADE:
        type: string
        required: true
        description: Балл за работу студента. Целое число от 0 до 100.
    tasks:
      - name: submit-grade
        cubes:
          - name: validate-grade
            script:
              - |
                is_valid_grade() {
                  local value="$1"
                  [[ "$value" =~ ^[0-9]+$ ]] || return 1
                  (( value >= 0 && value <= 100 ))
                }

                if ! is_valid_grade "${{ inputs.GRADE }}"; then
                  echo "Invalid grade: \"${{ inputs.GRADE }}\". Expected integer from 0 to 100."
                  exit 1
                fi

          - name: prepare-student-repo-slug
            script:
              - |
                echo "STUDENT_REPO_SLUG=$(basename "$SOURCECRAFT_REPO_URL" .git)" >> $SOURCECRAFT_OUTPUT

          - name: run-shared-workflow
            allow_failure: true
            image: cr.yandex/sourcecraft/cubes/shared-workflows:latest
            env:
              ORG_SLUG: ya-schools-summer
              REPO_SLUG: shbr-internal-automations
              WORKFLOW_NAME: submit-grade
              WORKFLOW_VALUES: |
                [
                  {"name": "TRACK",             "value": "cpp"},
                  {"name": "TASK_SLUG",         "value": "${{ env.SOURCECRAFT_COMMIT_REF_NAME }}"},
                  {"name": "GRADE",             "value": "${{ inputs.GRADE }}"},
                  {"name": "STUDENT_REPO_SLUG", "value": "${{ cubes.prepare-student-repo-slug.outputs.STUDENT_REPO_SLUG }}"}
                ]
              TASK_NAME: submit
              CUBE_NAME: result
              ARTIFACT_LOCAL_PATH: artifacts/output
            artifacts:
              paths:
                - artifacts/output

          - name: get-result
            script:
              - |
                cat artifacts/output
                if [ "${{ cubes.run-shared-workflow.status }}" != "success" ]; then
                  exit 1
                fi

on:
  pull_request: check-pr
