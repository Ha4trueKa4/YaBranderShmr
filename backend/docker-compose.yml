services:
  postgres:
    container_name: service-postgres
    image: postgres:18
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d ya_brander_db_1"]
      interval: 2s
      timeout: 5s
      retries: 10
    environment:
      - POSTGRES_DB=ya_brander_db_1
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=password
      - PGDATA=/var/lib/postgresql/data
    ports:
      - 5432
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - postgres

  migrate:
    container_name: service-migrate
    image: postgres:18
    environment:
      - PGHOST=postgres
      - PGPORT=5432
      - PGUSER=user
      - PGPASSWORD=password
      - PGDATABASE=ya_brander_db_1
      - MIGRATIONS_DIR=/postgresql/migrations/db-1
      - SEED_FILE=/postgresql/data/initial_data.sql
      - ADMIN_EMAIL=${ADMIN_EMAIL}
      - ADMIN_PASSWORD_HASH=${ADMIN_PASSWORD_HASH}
    volumes:
      - ./postgresql:/postgresql:ro
      - ./scripts:/scripts:ro
    entrypoint: ["bash", "/scripts/run_migrations.sh"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - postgres

  vector-postgres:
    container_name: service-vector-postgres
    image: pgvector/pgvector:pg18
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d vector_db"]
      interval: 2s
      timeout: 5s
      retries: 10
    environment:
      - POSTGRES_DB=vector_db
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=password
      - PGDATA=/var/lib/postgresql/data
    volumes:
      - pgvector_data:/var/lib/postgresql/data
    networks:
      - postgres

  migrate-vector:
    container_name: service-migrate-vector
    image: pgvector/pgvector:pg18
    environment:
      - PGHOST=vector-postgres
      - PGPORT=5432
      - PGUSER=user
      - PGPASSWORD=password
      - PGDATABASE=vector_db
      - MIGRATIONS_DIR=/postgresql/migrations/vector-db
      - SEED_FILE=/postgresql/data/vector_initial_data.sql
    volumes:
      - ./postgresql:/postgresql:ro
      - ./scripts:/scripts:ro
    entrypoint: ["bash", "/scripts/run_migrations.sh"]
    restart: "no"
    depends_on:
      vector-postgres:
        condition: service_healthy
    networks:
      - postgres

  redis:
    container_name: service-redis
    image: redis:7
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 5s
      retries: 10
    # Порт на хост не публикуется: ya_brander-container достаёт service-redis
    # по имени внутри docker-сети postgres, доступ с хоста не нужен. С пустым
    # паролем (см. .env.example) публиковать порт на всех интерфейсах было бы
    # небезопасно.
    networks:
      - postgres

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.159.0
    container_name: service-otel-collector
    environment:
      - MONIUM_PROJECT=${MONIUM_PROJECT}
      - MONIUM_API_KEY=${MONIUM_API_KEY}
      - YA_BRANDER_HOST=ya_brander-container
      - OTEL_SERVICE_NAME=ya-brander
    volumes:
      - ./otel/otel-collector.yaml:/etc/otelcol-contrib/config.yaml:ro
    networks:
      - postgres
      - default

  otel-collector-healthcheck:
    image: curlimages/curl:8.10.1
    container_name: service-otel-collector-healthcheck
    entrypoint: ["sh", "-c"]
    command:
      - |
        for i in $(seq 1 30); do
          curl -sf http://otel-collector:13133 >/dev/null 2>&1 && exit 0
          sleep 1
        done
        echo 'otel-collector health check timed out' >&2
        exit 1
    restart: "no"
    depends_on:
      otel-collector:
        condition: service_started
    networks:
      - default

  ya_brander-container:
    image: ghcr.io/userver-framework/ubuntu-22.04-userver-pg:v3.0
    privileged: true
    environment:
      - POSTGRES_DB=ya_brander_db_1
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=password
      - HTTP_PROXY=http://172.20.0.1:7890
      - HTTPS_PROXY=http://172.20.0.1:7890
      - NO_PROXY=localhost,127.0.0.1,postgres,vector-postgres,service-postgres,service-vector-postgres
      - PREFIX=${PREFIX:-~/.local}
      - CCACHE_DIR=/ya_brander/.ccache
      - CORES_DIR=/cores
      - USERVER_ENABLE_STACK_USAGE_MONITOR=0
      - YANDEX_AI_API_KEY=${YANDEX_AI_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - S3_ACCESS_KEY_ID=${S3_ACCESS_KEY_ID}
      - S3_SECRET_KEY=${S3_SECRET_KEY}
      - YANDEX_OAUTH_CLIENT_ID=${YANDEX_OAUTH_CLIENT_ID}
      - YANDEX_OAUTH_CLIENT_SECRET=${YANDEX_OAUTH_CLIENT_SECRET}
      - SECDIST_CONFIG=${SECDIST_CONFIG}
      - GC_ENABLED=${GC_ENABLED}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - MONIUM_PROJECT=${MONIUM_PROJECT}
      - MONIUM_API_KEY=${MONIUM_API_KEY}
    volumes:
      - .:/ya_brander:rw
      - ${TC_CORES_DIR:-./.cores}:/cores:rw
    ports:
      - 8080:8080
    working_dir: /ya_brander
    entrypoint:
      - ./tests/run_as_user.sh
    depends_on:
      migrate:
        condition: service_completed_successfully
      migrate-vector:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      otel-collector-healthcheck:
        condition: service_completed_successfully
    networks:
      postgres:
      default:
        aliases:
          - ya_brander-container

  prometheus:
    container_name: service-prometheus
    image: prom/prometheus:v2.55.1
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - 9090:9090
    networks:
      - default

  grafana:
    container_name: service-grafana
    image: grafana/grafana:11.2.0
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_AUTH_ANONYMOUS_ENABLED=false
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - 3000:3000
    networks:
      - default
    depends_on:
      - prometheus

networks:
    postgres:
        driver: bridge
    default:
      driver: bridge
volumes:
  pgdata:
  pgvector_data:
  grafana_data: