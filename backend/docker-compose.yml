services:
  postgres:
    container_name: service-postgres
    image: postgres:18
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d ya_brander_db_1"]
      interval: 2s
      timeout: 5s
      retries: 10
    environment:
      - POSTGRES_DB=ya_brander_db_1
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=password
      - PGDATA=/var/lib/postgresql/data
    ports:
      - 5432
    volumes:
      - ./postgresql/schemas/db-1.sql:/docker-entrypoint-initdb.d/01_db-1.sql
      - ./postgresql/data/initial_data.sql:/docker-entrypoint-initdb.d/02_initial_data.sql
      - pgdata:/var/lib/postgresql/data
    networks:
      - postgres
  vector-postgres:                         
    container_name: service-vector-postgres
    image: pgvector/pgvector:pg18
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d vector_db"]
      interval: 2s
      timeout: 5s
      retries: 10
    environment:
      - POSTGRES_DB=vector_db
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=password
      - PGDATA=/var/lib/postgresql/data
    volumes:
      - ./postgresql/schemas/vector-db.sql:/docker-entrypoint-initdb.d/01_vector_db.sql
      - ./postgresql/data/vector_initial_data.sql:/docker-entrypoint-initdb.d/02_vector_initial_data.sql
      - pgvector_data:/var/lib/postgresql/data
    networks:
      - postgres
  ya_brander-container:
    image: ghcr.io/userver-framework/ubuntu-22.04-userver-pg:v3.0
    privileged: true
    environment:
      - POSTGRES_DB=ya_brander_db_1
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=password
      - PREFIX=${PREFIX:-~/.local}
      - CCACHE_DIR=/ya_brander/.ccache
      - CORES_DIR=/cores
      - USERVER_ENABLE_STACK_USAGE_MONITOR=0
      - YANDEX_AI_API_KEY=${YANDEX_AI_API_KEY}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - S3_ACCESS_KEY_ID=${S3_ACCESS_KEY_ID}
      - S3_SECRET_KEY=${S3_SECRET_KEY}
    volumes:
      - .:/ya_brander:rw
      - ${TC_CORES_DIR:-./.cores}:/cores:rw
    ports:
      - 8080:8080
    working_dir: /ya_brander
    entrypoint:
      - ./tests/run_as_user.sh
    depends_on:
      postgres:
        condition: service_healthy
      vector-postgres:
        condition: service_healthy
    networks:
      - postgres
      - default

networks:
    postgres:
        driver: bridge
    default:
      driver: bridge
volumes:
  pgdata:
  pgvector_data:
