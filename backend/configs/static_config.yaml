components_manager:
  task_processors: # Task processor is an executor for coroutine tasks

    main-task-processor: # Make a task processor for CPU-bound couroutine tasks.
      worker_threads: $worker-threads         # Process tasks in 4 threads.

    fs-task-processor: # Make a separate task processor for filesystem bound tasks.
      worker_threads: $worker-fs-threads

  default_task_processor: main-task-processor

  components: # Configuring components that were registered via component_list
    server:
      listener: # configuring the main listening socket...
        port: $server-port            # ...to listen on this port and...
        task_processor: main-task-processor    # ...process incoming requests on this task processor.

    cors-middleware:
      allowed-origins:
        - http://localhost:5173
        - https://ya-brander-frontend.website.yandexcloud.net
      allowed-headers:
        - Accept
        - Accept-Language
        - Content-Language
        - Content-Type
        - Authorization

    default-server-middleware-pipeline-builder:
      append:
        - cors-middleware
    logging:
      fs-task-processor: fs-task-processor
      loggers:
        default:
          file_path: '@stderr'
          level: $logger-level
          overflow_behavior: discard  # Drop logs if the system is too busy to write them down.

    # Dynamic config options. Cache is disabled, updates are disabled.
    dynamic-config:
      # For most of userver dynamic configs, defaults are used, some are overridden here.
      # See userver "dynamic config" docs for what configs exist.
      defaults:
        HTTP_CLIENT_CONNECTION_POOL_SIZE: 2000
        POSTGRES_DEFAULT_COMMAND_CONTROL:
          network_timeout_ms: 3000
          statement_timeout_ms: 2500

    testsuite-support: { }

    http-client:

    http-client-core:
      #      load-enabled: $is-testing
      fs-task-processor: fs-task-processor

    http-client-middleware-pipeline: { }
    #      load-enabled: $is-testing

    tests-control:
      load-enabled: $is-testing
      path: /tests/{action}
      method: POST
      task_processor: main-task-processor

    handler-ping:
      path: /ping
      method: GET
      task_processor: main-task-processor
      throttling_enabled: false
      url_trailing_slash: strict-match

    handler-check:
      path: /check
      method: GET
      task_processor: main-task-processor

    handler-test-llm:
      path: /test/llm
      method: POST
      task_processor: main-task-processor
      throttling_enabled: false

    handler-test-vector-search:
      path: /test/vector-search
      method: GET
      task_processor: main-task-processor

    llm-client:
      api-url: $yandex-gpt-url

    postgres-db-1:
      dbconnection: $dbconnection
      blocking_task_processor: fs-task-processor
      dns_resolver: async
      sync-start: false
      connlimit_mode: manual
      max_pool_size: 50
    
    postgres-vector-db:
      dbconnection: $dbconnection-vector
      blocking_task_processor: fs-task-processor
      dns_resolver: async
      sync-start: false
      connlimit_mode: manual
      max_pool_size: 50

    dns-client:
      fs-task-processor: fs-task-processor

    # ==========================================
    # Внешние сервисы (или их моки)
    # ==========================================
    version-storage: { }
    vector-search:
      embedding-url: $yandex-embedding-url
      pg-component-name: postgres-vector-db
      db-table: vector_examples
      embedding-model: text-embeddings-v2-query

    object-storage:
      bucket: ya-brander-svg
      endpoint: $s3-endpoint
      region: ru-central1
      presigned-url-ttl-seconds: 3600   # ссылки на один час для приватных объектов

    # ==========================================
    # Слой бизнес-логики (Service Layer)
    # ==========================================
    project-manager: { }
    prompt-constructor: { }
    subscription-storage: { }


    # ==========================================
    # HTTP Хендлеры (Контроллеры проектов)
    # ==========================================
    handler-models-get:
      path: /api/v1/models
      method: GET
      task_processor: main-task-processor
      api-url: $yandex-gpt-models-url

    handler-projects-create:
      path: /api/v1/projects
      method: POST
      task_processor: main-task-processor
      auth:
        types:
          - jwt

    handler-projects-get:
      path: /api/v1/projects/{id}
      method: GET
      task_processor: main-task-processor
      auth:
        types:
          - jwt

    handler-projects-patch:
      path: /api/v1/projects/{id}
      method: PATCH
      task_processor: main-task-processor
      auth:
        types:
          - jwt

    handler-projects-delete:
      path: /api/v1/projects/{id}
      method: DELETE
      task_processor: main-task-processor
      auth:
        types:
          - jwt

    handler-projects-generate:
      path: /api/v1/projects/{id}/generate
      method: POST
      task_processor: main-task-processor
      auth:
        types:
          - jwt
      max_requests_in_flight: 150
      max_requests_per_second: 300

    handler-projects-versions-list:
      path: /api/v1/projects/{id}/versions
      method: GET
      task_processor: main-task-processor
      auth:
        types:
          - jwt

    handler-projects-versions-get:
      path: /api/v1/projects/{id}/versions/{version_id}
      method: GET
      task_processor: main-task-processor
      auth:
        types:
          - jwt

    handler-projects-versions-restore:
      path: /api/v1/projects/{id}/versions/{version_id}/restore
      method: POST
      task_processor: main-task-processor
      auth:
        types:
          - jwt

    handler-projects-chat:
      path: /api/v1/projects/{id}/chat
      method: GET
      task_processor: main-task-processor
      auth:
        types:
          - jwt

    handler-auth-register:
      path: /api/v1/auth/register
      method: POST
      task_processor: main-task-processor

    handler-auth-login:
      path: /api/v1/auth/login
      method: POST
      task_processor: main-task-processor

    handler-users-subscribe:
      path: /api/v1/users/{id}/subscribe
      method: POST
      task_processor: main-task-processor
      auth:
        types:
          - jwt

    handler-users-unsubscribe:
      path: /api/v1/users/{id}/subscribe
      method: DELETE
      task_processor: main-task-processor
      auth:
        types:
          - jwt

    handler-feed:
      path: /api/v1/feed
      method: GET
      task_processor: main-task-processor
      auth:
        types:
          - jwt
    handler-users-get:
      path: /api/v1/users/{id}
      method: GET
      task_processor: main-task-processor
      auth:
        types:
          - jwt

    handler-users-subscribers-get:
      path: /api/v1/users/{id}/subscribers
      method: GET
      task_processor: main-task-processor
      auth:
        types:
          - jwt

    handler-users-subscriptions-get:
      path: /api/v1/users/{id}/subscriptions
      method: GET
      task_processor: main-task-processor
      auth:
        types:
          - jwt

