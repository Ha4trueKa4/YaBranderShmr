stages:
  - build

variables:
  REGISTRY: cr.yandex/crpso93aahtuvujb7jlk
  IMAGE: ya-brander
  REMOTE_APP_DIR: team-05-project-konstruktor-avatarok-dlya-rabochikh-chatov-vizitok-i-profilei

build-check:
  stage: build
  image: docker:latest
  services:
    - docker:dind
  script:
    # Только проверка сборки: компилируем образ, НЕ публикуем в registry.
    # Не трогаем тег latest — прод-образ не затирается незамерженным кодом.
    #
    # --cache-from (read-only): подтягиваем BuildKit-кэш из реестра, чтобы PR-проверка
    # не собиралась с нуля. БЕЗ --cache-to: PR-кэш не должен перезаписывать кэш main.
    # ВАЖНО: команда на ОДНОЙ строке — в этом раннере "\"-переносы строк ломают
    # разбор аргументов docker build ("docker buildx build requires 1 argument").
    - docker build --provenance=false --sbom=false --cache-from=type=registry,ref=$REGISTRY/$IMAGE:cache -t $REGISTRY/$IMAGE:$CI_COMMIT_SHA -f backend/Dockerfile backend/