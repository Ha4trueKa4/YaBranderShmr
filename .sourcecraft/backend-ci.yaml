stages:
  - build
  - deploy

variables:
  REGISTRY: cr.yandex/crpso93aahtuvujb7jlk
  IMAGE: ya-brander

build:
  stage: build
  image: docker:latest
  services:
    - docker:dind
  script:
    # контекст сборки - папка backend, Dockerfile - backend/Dockerfile
    - docker build -t $REGISTRY/$IMAGE:$CI_COMMIT_SHA -f backend/Dockerfile backend/
    - echo "$YC_SA_JSON" | docker login --username json_key --password-stdin cr.yandex
    - docker push $REGISTRY/$IMAGE:$CI_COMMIT_SHA
    - docker tag $REGISTRY/$IMAGE:$CI_COMMIT_SHA $REGISTRY/$IMAGE:latest
    - docker push $REGISTRY/$IMAGE:latest

deploy:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache openssh-client
  script:
    - echo "$YC_SSH_PRIVATE_KEY" > /tmp/deploy_key && chmod 600 /tmp/deploy_key
    - ssh -i /tmp/deploy_key -o StrictHostKeyChecking=no $YC_SERVER_USER@$YC_SERVER_IP "
        docker pull $REGISTRY/$IMAGE:latest &&
        docker stop ya-brander || true &&
        docker rm ya-brander || true &&
        docker run -d --name ya-brander --restart unless-stopped -p 6767:6767 $REGISTRY/$IMAGE:latest
      "