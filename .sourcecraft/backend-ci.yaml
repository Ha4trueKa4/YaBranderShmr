stages:
  - build
  - deploy

variables:
  REGISTRY: cr.yandex/crpso93aahtuvujb7jlk
  IMAGE: ya-brander
  REMOTE_APP_DIR: team-05-project-konstruktor-avatarok-dlya-rabochikh-chatov-vizitok-i-profilei

build:
  stage: build
  image: docker:latest
  services:
    - docker:dind
  script:
    # контекст сборки - папка backend, Dockerfile - backend/Dockerfile
    # --provenance=false --sbom=false ОБЯЗАТЕЛЬНЫ: без них Yandex CR отклоняет пуш
    # с ошибкой "Cannot read manifest data" (attestation-манифесты Docker/BuildKit)
    - docker build --provenance=false --sbom=false -t $REGISTRY/$IMAGE:$CI_COMMIT_SHA -f backend/Dockerfile backend/
    - echo "$YC_SA_JSON" | docker login --username json_key --password-stdin cr.yandex
    - docker push $REGISTRY/$IMAGE:$CI_COMMIT_SHA
    - docker tag $REGISTRY/$IMAGE:$CI_COMMIT_SHA $REGISTRY/$IMAGE:latest
    - docker push $REGISTRY/$IMAGE:latest

deploy:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache openssh-client
  script:
    - echo "$YC_SSH_PRIVATE_KEY" | base64 -d > /tmp/deploy_key && chmod 600 /tmp/deploy_key
    # Собираем .env в base64 на раннере — это избавляет от проблем с экранированием
    # спецсимволов (JWT_SECRET_KEY содержит & * #). Значение НЕ выводится в лог.
    - >
      printf 'YANDEX_AI_API_KEY=%s\nJWT_SECRET_KEY=%s\n' "$YANDEX_AI_API_KEY" "$JWT_SECRET_KEY"
      | base64 -w0 > /tmp/env_b64
    # base64 передаётся через stdin, а не через подстановку $(...) внутри
    # двойных кавычек — так безопаснее и не зависит от содержимого строки.
    - >
      cat /tmp/env_b64 | ssh -i /tmp/deploy_key -o StrictHostKeyChecking=no $YC_SERVER_USER@$YC_SERVER_IP
      "mkdir -p ~/$REMOTE_APP_DIR/backend && base64 -d > ~/$REMOTE_APP_DIR/backend/.env"
    - rm -f /tmp/env_b64
    - ssh -i /tmp/deploy_key -o StrictHostKeyChecking=no $YC_SERVER_USER@$YC_SERVER_IP "
        docker pull $REGISTRY/$IMAGE:latest &&
        docker stop ya-brander || true &&
        docker rm ya-brander || true &&
        docker network create ya-brander-net || true &&
        docker inspect service-postgres >/dev/null 2>&1 && docker network connect ya-brander-net service-postgres || true &&
        docker run -d --name ya-brander --restart unless-stopped \
          --network ya-brander-net \
          -p 8080:8080 \
          --env-file ~/$REMOTE_APP_DIR/backend/.env \
          $REGISTRY/$IMAGE:latest
      "