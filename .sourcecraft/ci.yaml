# Required SourceCraft repository secrets:
#   YC_S3_BUCKET            — Object Storage bucket name for the dev site
#   YC_S3_ACCESS_KEY_ID     — static access key ID of the deploy service account
#   YC_S3_SECRET_ACCESS_KEY — static secret access key of the deploy service account
#   VITE_API_URL_DEV         — public HTTPS API URL, including /api/v1
#   VITE_HEALTH_URL_DEV      — public HTTPS health-check URL
#
# Проверки frontend, backend и Android запускаются только для pull request в main
# и только если затронуты файлы соответствующего проекта.

on:
  pull_request:
    - workflows: build-android
      filter:
        target_branches: ["main"]
        paths: ["android/**"]
    - workflows: build-backend-check
      filter:
        target_branches: ["main"]
        paths: ["backend/**"]
    - workflows: check-frontend
      filter:
        target_branches: ["main"]
        paths: ["frontend/**"]

  push:
    - workflows: [deploy-frontend-dev]
      filter:
        branches: [main]
        paths: ["frontend/**"]
    - workflows: [build-and-deploy-backend]
      filter:
        branches: ["main"]
        paths: ["backend/**"]

workflows:
  # Полная проверка frontend на этапе pull request без деплоя.
  check-frontend:
    tasks:
      - name: check-test-and-build
        cubes:
          - name: install-check-test-and-build
            image: docker.io/library/node:22-bookworm
            script:
              - cd frontend
              - corepack enable
              - corepack prepare pnpm@11.16.0 --activate
              - pnpm install --frozen-lockfile
              - pnpm check
              - pnpm test
              - pnpm build

  # Проверка компиляции backend на этапе pull request:
  # только docker build (без публикации образа и без затирания тега latest).
  build-backend-check:
    tasks:
      - name: build
        cubes:
          - name: run-build-backend-check
            gitlab_workflow: .sourcecraft/build-backend-check.yaml
            env:
              YC_SA_JSON: ${{ secrets.YC_SA_JSON }}

  # Сборка + публикация образа в registry, затем деплой — строго по порядку
  # (задание deploy стартует только после успешного завершения задания build).
  build-and-deploy-backend:
    tasks:
      - name: build
        cubes:
          - name: run-build-backend
            gitlab_workflow: .sourcecraft/build-backend.yaml
            env:
              YC_SA_JSON: ${{ secrets.YC_SA_JSON }}

      - name: deploy
        needs: [build]
        cubes:
          - name: run-deploy-backend
            gitlab_workflow: .sourcecraft/deploy-backend.yaml
            env:
              YC_SA_JSON: ${{ secrets.YC_SA_JSON }}
              YC_SERVER_IP: ${{ secrets.YC_SERVER_IP }}
              YC_SERVER_USER: ${{ secrets.YC_SERVER_USER }}
              YC_SSH_PRIVATE_KEY: ${{ secrets.YC_SSH_PRIVATE_KEY }}
              JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY }}
              YANDEX_AI_API_KEY: ${{ secrets.YANDEX_AI_API_KEY }}
              YANDEX_OAUTH_CLIENT_ID: ${{ secrets.YANDEX_OAUTH_CLIENT_ID }}
              YANDEX_OAUTH_CLIENT_SECRET: ${{ secrets.YANDEX_OAUTH_CLIENT_SECRET }}
              S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
              S3_SECRET_KEY: ${{ secrets.S3_SECRET_KEY }}
              GC_ENABLED: ${{ secrets.GC_ENABLED }}
              REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}
              OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
              MONIUM_PROJECT: ${{ secrets.MONIUM_PROJECT }}
              MONIUM_API_KEY: ${{ secrets.MONIUM_API_KEY }}
              ADMIN_ID: ${{ secrets.ADMIN_ID }}
              ADMIN_PASSWORD_HASH: ${{ secrets.ADMIN_PASSWORD_HASH }}
              ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}

  deploy-frontend-dev:
    tasks:
      - name: check-build-and-deploy
        env:
          YC_S3_BUCKET: ${{ secrets.YC_S3_BUCKET }}
          AWS_ACCESS_KEY_ID: ${{ secrets.YC_S3_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.YC_S3_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ru-central1
          AWS_EC2_METADATA_DISABLED: "true"
          VITE_API_URL: ${{ secrets.VITE_API_URL_DEV }}
          VITE_HEALTH_URL: ${{ secrets.VITE_HEALTH_URL_DEV }}
          VITE_YANDEX_OAUTH_CLIENT_ID: ${{ secrets.YANDEX_OAUTH_CLIENT_ID }}
        cubes:
          - name: install-check-and-build
            image: docker.io/library/node:22-bookworm
            script:
              - cd frontend
              - corepack enable
              - corepack prepare pnpm@11.16.0 --activate
              - pnpm install --frozen-lockfile
              - pnpm check
              - pnpm test
              - pnpm build

          - name: upload-static-site
            image:
              name: public.ecr.aws/aws-cli/aws-cli:latest
              entrypoint: ""
            script:
              - cd frontend
              - aws s3 sync dist "s3://$YC_S3_BUCKET" --delete --no-progress --exclude "index.html" --cache-control "public, max-age=31536000, immutable" --endpoint-url https://storage.yandexcloud.net
              - aws s3 cp dist/index.html "s3://$YC_S3_BUCKET/index.html" --no-progress --cache-control "no-cache, no-store, must-revalidate" --content-type "text/html; charset=utf-8" --endpoint-url https://storage.yandexcloud.net

  build-android:
    tasks:
      - name: build-android-task
        cubes:
          - name: assemble-debug
            image: eclipse-temurin:25-jdk
            env:
              ANDROID_HOME: /opt/android-sdk
              ANDROID_SDK_ROOT: /opt/android-sdk
            script:
              - apt-get update && apt-get install -y --no-install-recommends wget unzip
              - mkdir -p "$ANDROID_HOME/cmdline-tools"
              - wget -q https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip -O /tmp/cmdtools.zip
              - unzip -q /tmp/cmdtools.zip -d "$ANDROID_HOME/cmdline-tools"
              - mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
              - export ANDROID_SDK_ROOT="$ANDROID_HOME"
              - export PATH="$PATH:$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$ANDROID_HOME/build-tools/36.0.0"
              - yes | sdkmanager --licenses > /dev/null
              - sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
              - cd android
              - echo "sdk.dir=$ANDROID_HOME" > local.properties
              - ./gradlew assembleDebug
            artifacts:
              paths:
                - android/app/build/outputs/apk

      - name: lint-android-task
        cubes:
          - name: android-lint
            image: eclipse-temurin:25-jdk
            env:
              ANDROID_HOME: /opt/android-sdk
              ANDROID_SDK_ROOT: /opt/android-sdk
            script:
              - apt-get update && apt-get install -y --no-install-recommends wget unzip
              - mkdir -p "$ANDROID_HOME/cmdline-tools"
              - wget -q https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip -O /tmp/cmdtools.zip
              - unzip -q /tmp/cmdtools.zip -d "$ANDROID_HOME/cmdline-tools"
              - mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
              - export ANDROID_SDK_ROOT="$ANDROID_HOME"
              - export PATH="$PATH:$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$ANDROID_HOME/build-tools/36.0.0"
              - yes | sdkmanager --licenses > /dev/null
              - sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
              - cd android
              - echo "sdk.dir=$ANDROID_HOME" > local.properties
              - ./gradlew lint
