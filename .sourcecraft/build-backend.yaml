stages:
  - build

variables:
  REGISTRY: cr.yandex/crpso93aahtuvujb7jlk
  IMAGE: ya-brander
  REMOTE_APP_DIR: team-05-project-konstruktor-avatarok-dlya-rabochikh-chatov-vizitok-i-profilei

build:
  stage: build
  image: docker:latest
  services:
    - docker:dind
  script:
    # --provenance=false --sbom=false обязательны: без них Yandex CR отклоняет пуш
    # (attestation-манифесты). Логин до сборки — кэш тянется из приватного CR.
    - echo "$YC_SA_JSON" | docker login --username json_key --password-stdin cr.yandex
    # BuildKit-кэш в реестре (:cache): --cache-from подтягивает слои, --cache-to пишет новые.
    # Команда на одной строке — "\"-переносы ломают разбор аргументов docker build.
    - docker build --provenance=false --sbom=false --cache-from=type=registry,ref=$REGISTRY/$IMAGE:cache --cache-to=type=registry,ref=$REGISTRY/$IMAGE:cache,mode=max -t $REGISTRY/$IMAGE:$CI_COMMIT_SHA -f backend/Dockerfile backend/
    - docker push $REGISTRY/$IMAGE:$CI_COMMIT_SHA
    - docker tag $REGISTRY/$IMAGE:$CI_COMMIT_SHA $REGISTRY/$IMAGE:latest
    - docker push $REGISTRY/$IMAGE:latest
    # Чистим локальный тег по SHA (в самом CR он остаётся для откатов).
    - docker rmi $REGISTRY/$IMAGE:$CI_COMMIT_SHA