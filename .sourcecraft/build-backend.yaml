stages:
  - build

variables:
  REGISTRY: cr.yandex/crpso93aahtuvujb7jlk
  IMAGE: ya-brander
  REMOTE_APP_DIR: team-05-project-konstruktor-avatarok-dlya-rabochikh-chatov-vizitok-i-profilei

build:
  stage: build
  image: docker:latest
  services:
    - docker:dind
  script:
    # --provenance=false --sbom=false обязательны: без них Yandex CR отклоняет пуш
    # (attestation-манифесты). Логин до сборки — кэш тянется из приватного CR.
    - echo "$YC_SA_JSON" | docker login --username json_key --password-stdin cr.yandex
    # docker-драйвер не пишет registry-кэш — нужен buildx docker-container драйвер.
    # Переиспользуем билдер yc-builder, если он уже создан.
    - docker buildx create --name yc-builder --driver docker-container --use || docker buildx use yc-builder
    # BuildKit-кэш (:cache): --cache-from подтягивает слои, --cache-to пишет новые (mode=max).
    # --push собирает и пушит оба тега (SHA + latest) из билдера. Команда на одной строке.
    - docker buildx build --provenance=false --sbom=false --push --cache-from=type=registry,ref=$REGISTRY/$IMAGE:cache --cache-to=type=registry,ref=$REGISTRY/$IMAGE:cache,mode=max -t $REGISTRY/$IMAGE:$CI_COMMIT_SHA -t $REGISTRY/$IMAGE:latest -f backend/Dockerfile backend/