stages:
  - build

variables:
  REGISTRY: cr.yandex/crpso93aahtuvujb7jlk
  IMAGE: ya-brander
  REMOTE_APP_DIR: team-05-project-konstruktor-avatarok-dlya-rabochikh-chatov-vizitok-i-profilei

build:
  stage: build
  image: docker:latest
  services:
    - docker:dind
  script:
    # контекст сборки - папка backend, Dockerfile - backend/Dockerfile
    # --provenance=false --sbom=false ОБЯЗАТЕЛЬНЫ: без них Yandex CR отклоняет пуш
    # с ошибкой "Cannot read manifest data" (attestation-манифесты Docker/BuildKit)
    #
    # Логин ДО сборки: --cache-from=type=registry тянет кэш из приватного реестра,
    # поэтому авторизация нужна уже на этапе build, а не перед пушем.
    - echo "$YC_SA_JSON" | docker login --username json_key --password-stdin cr.yandex
    # Персистентный BuildKit-кэш через реестр: --cache-from подтягивает прошлые слои,
    # --cache-to пишет обновлённый кэш под тегом :cache (mode=max сохраняет весь граф).
    # Это устраняет холодные сборки между запусками.
    - docker build --provenance=false --sbom=false \
        --cache-from=type=registry,ref=$REGISTRY/$IMAGE:cache \
        --cache-to=type=registry,ref=$REGISTRY/$IMAGE:cache,mode=max \
        -t $REGISTRY/$IMAGE:$CI_COMMIT_SHA -f backend/Dockerfile backend/
    - docker push $REGISTRY/$IMAGE:$CI_COMMIT_SHA
    - docker tag $REGISTRY/$IMAGE:$CI_COMMIT_SHA $REGISTRY/$IMAGE:latest
    - docker push $REGISTRY/$IMAGE:latest
    # Чистим локальный образ с тегом по SHA в раннере, чтобы не копить слои
    # на диске. Примечание: в самом Yandex CR тег по SHA остаётся (для откатов),
    # удаление именно из реестра делается вручную/по API.
    - docker rmi $REGISTRY/$IMAGE:$CI_COMMIT_SHA