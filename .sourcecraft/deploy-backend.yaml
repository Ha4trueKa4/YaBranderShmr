stages:
  - deploy

variables:
  REGISTRY: cr.yandex/crpso93aahtuvujb7jlk
  IMAGE: ya-brander
  REMOTE_APP_DIR: team-05-project-konstruktor-avatarok-dlya-rabochikh-chatov-vizitok-i-profilei

deploy:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache openssh-client
  script:
    # --- 1. Подготовка ключа и переменных окружения ---
    - echo "$YC_SSH_PRIVATE_KEY" | base64 -d > /tmp/deploy_key && chmod 600 /tmp/deploy_key
    - >
      printf 'YANDEX_AI_API_KEY=%s\nJWT_SECRET_KEY=%s\nS3_ACCESS_KEY_ID=%s\nS3_SECRET_KEY=%s\n' "$YANDEX_AI_API_KEY" "$JWT_SECRET_KEY" "$S3_ACCESS_KEY_ID" "$S3_SECRET_KEY"
      | base64 -w0 > /tmp/env_b64
    - >
      cat /tmp/env_b64 | ssh -i /tmp/deploy_key -o StrictHostKeyChecking=no $YC_SERVER_USER@$YC_SERVER_IP
      "mkdir -p ~/$REMOTE_APP_DIR/backend && base64 -d > ~/$REMOTE_APP_DIR/backend/.env"
    - rm -f /tmp/env_b64

    # --- 2. Доставка файлов миграций на сервер ---
    # run_migrations.sh и SQL-файлы миграций не входят в Docker-образ backend,
    # поэтому передаём их на сервер отдельно (tar-стримом по SSH).
    - >
      tar -C backend -czf - postgresql scripts |
      ssh -i /tmp/deploy_key -o StrictHostKeyChecking=no $YC_SERVER_USER@$YC_SERVER_IP
      "mkdir -p ~/$REMOTE_APP_DIR/backend && tar -xzf - -C ~/$REMOTE_APP_DIR/backend"

    # --- 3. Применение миграций к основной БД (ya_brander_db_1) ---
    # Запускается одноразовый контейнер postgres:18, который выполняет
    # run_migrations.sh против service-postgres в сети ya-brander-net.
    # ВАЖНО: SEED_FILE здесь НЕ передаётся — seed-данные (initial_data.sql)
    # начинаются с TRUNCATE и уничтожили бы реальные пользовательские данные.
    # Применяются только версионированные миграции из postgresql/migrations/db-1.
    # set -e: любая упавшая команда миграции (не ноль) прерывает ssh-скрипт и,
    # как следствие, весь деплой до запуска бэкенда.
    - >
      ssh -i /tmp/deploy_key -o StrictHostKeyChecking=no $YC_SERVER_USER@$YC_SERVER_IP "
        set -e
        docker rm -f ya-brander-migrate 2>/dev/null || true
        docker run --rm --name ya-brander-migrate --network ya-brander-net \
          -e PGHOST=service-postgres -e PGPORT=5432 \
          -e PGUSER=user -e PGPASSWORD=password -e PGDATABASE=ya_brander_db_1 \
          -e MIGRATIONS_DIR=/postgresql/migrations/db-1 \
          -v ~/$REMOTE_APP_DIR/backend/postgresql:/postgresql:ro \
          -v ~/$REMOTE_APP_DIR/backend/scripts:/scripts:ro \
          postgres:18 bash /scripts/run_migrations.sh
        echo 'main DB migrations ok'
      "

    # --- 4. Применение миграций к векторной БД (vector_db), если она существует ---
    # Если контейнера нет — пропускаем (это не ошибка). Если есть, но миграции
    # упали — прерываем деплой явным exit 1 (внутри if с set -e статус тела
    # не экранируется автоматически, поэтому проверяем вручную).
    - >
      ssh -i /tmp/deploy_key -o StrictHostKeyChecking=no $YC_SERVER_USER@$YC_SERVER_IP "
        set -e
        if docker inspect service-vector-postgres >/dev/null 2>&1; then
          docker rm -f ya-brander-migrate-vector 2>/dev/null || true
          docker run --rm --name ya-brander-migrate-vector --network ya-brander-net \
            -e PGHOST=service-vector-postgres -e PGPORT=5432 \
            -e PGUSER=user -e PGPASSWORD=password -e PGDATABASE=vector_db \
            -e MIGRATIONS_DIR=/postgresql/migrations/vector-db \
            -v ~/$REMOTE_APP_DIR/backend/postgresql:/postgresql:ro \
            -v ~/$REMOTE_APP_DIR/backend/scripts:/scripts:ro \
            postgres:18 bash /scripts/run_migrations.sh || {
              echo 'vector DB migrations FAILED' >&2
              exit 1
            }
          echo 'vector DB migrations ok'
        else
          echo 'service-vector-postgres not found, skipping vector migrations'
        fi
      "

    # --- 5. Деплой бэкенда ---
    # Команды разнесены по отдельным строкам (без связок &&), чтобы каждая
    # выполнялась безусловно: в частности, docker rm -f ya-brander должен
    # сработать всегда, иначе старый контейнер останется и docker run упадёт
    # с Conflict. Подключение service-postgres к ya-brander-net идемпотентно:
    # сначала отключаем (с подавлением ошибки), затем подключаем.
    - >
      ssh -i /tmp/deploy_key -o StrictHostKeyChecking=no $YC_SERVER_USER@$YC_SERVER_IP "
        docker system prune -af --filter \"until=24h\" || true
        echo '$YC_SA_JSON' | docker login --username json_key --password-stdin cr.yandex
        docker pull $REGISTRY/$IMAGE:latest
        docker rm -f ya-brander || true
        docker network create ya-brander-net || true
        docker network disconnect ya-brander-net service-postgres 2>/dev/null || true
        docker network connect ya-brander-net service-postgres || true
        docker run -d --name ya-brander --restart unless-stopped --network ya-brander-net -p 8080:8080 --env-file ~/$REMOTE_APP_DIR/backend/.env $REGISTRY/$IMAGE:latest
      "