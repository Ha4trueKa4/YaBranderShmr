stages:
  - deploy

variables:
  REGISTRY: cr.yandex/crpso93aahtuvujb7jlk
  IMAGE: ya-brander
  REMOTE_APP_DIR: team-05-project-konstruktor-avatarok-dlya-rabochikh-chatov-vizitok-i-profilei

deploy:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache openssh-client
  script:
    # --- 1. Подготовка ключа и переменных окружения ---
    - echo "$YC_SSH_PRIVATE_KEY" | base64 -d > /tmp/deploy_key && chmod 600 /tmp/deploy_key
    - >
      SECDIST_CONFIG_JSON=$(printf '{"redis_settings":{"ya_brander_jobs":{"password":"%s","sentinels":[{"host":"service-redis-sentinel","port":26379}],"shards":[{"name":"master0"}]}}}' "$REDIS_PASSWORD");
      printf 'YANDEX_AI_API_KEY=%s\nJWT_SECRET_KEY=%s\nS3_ACCESS_KEY_ID=%s\nS3_SECRET_KEY=%s\nYANDEX_OAUTH_CLIENT_ID=%s\nYANDEX_OAUTH_CLIENT_SECRET=%s\nREDIS_PASSWORD=%s\nOPENAI_API_KEY=%s\nGC_ENABLED=%s\nMONIUM_PROJECT=%s\nMONIUM_API_KEY=%s\nADMIN_ID=%s\nADMIN_PASSWORD_HASH=%s\nADMIN_EMAIL=%s\nSECDIST_CONFIG=%s\n' "$YANDEX_AI_API_KEY" "$JWT_SECRET_KEY" "$S3_ACCESS_KEY_ID" "$S3_SECRET_KEY" "$YANDEX_OAUTH_CLIENT_ID" "$YANDEX_OAUTH_CLIENT_SECRET" "$REDIS_PASSWORD" "$OPENAI_API_KEY" "$GC_ENABLED" "$MONIUM_PROJECT" "$MONIUM_API_KEY" "$ADMIN_ID" "$ADMIN_PASSWORD_HASH" "$ADMIN_EMAIL" "$SECDIST_CONFIG_JSON"
      | base64 -w0 > /tmp/env_b64
    - >
      cat /tmp/env_b64 | ssh -i /tmp/deploy_key -o StrictHostKeyChecking=no $YC_SERVER_USER@$YC_SERVER_IP
      "mkdir -p ~/$REMOTE_APP_DIR/backend && base64 -d > ~/$REMOTE_APP_DIR/backend/.env"
    - rm -f /tmp/env_b64

    # --- 2. Доставка файлов миграций на сервер ---
    # run_migrations.sh и SQL-файлы миграций не входят в Docker-образ backend,
    # поэтому передаём их на сервер отдельно (tar-стримом по SSH).
    - >
      tar -C backend -czf - postgresql scripts otel |
      ssh -i /tmp/deploy_key -o StrictHostKeyChecking=no $YC_SERVER_USER@$YC_SERVER_IP
      "mkdir -p ~/$REMOTE_APP_DIR/backend && tar -xzf - -C ~/$REMOTE_APP_DIR/backend"

    # --- 3. Применение миграций к основной БД (ya_brander_db_1) ---
    # Запускается одноразовый контейнер postgres:18, который выполняет
    # run_migrations.sh против service-postgres в сети ya-brander-net.
    # ВАЖНО: SEED_FILE здесь НЕ передаётся — seed-данные (initial_data.sql)
    # начинаются с TRUNCATE и уничтожили бы реальные пользовательские данные.
    # Применяются только версионированные миграции из postgresql/migrations/db-1.
    # set -e: любая упавшая команда миграции (не ноль) прерывает ssh-скрипт и,
    # как следствие, весь деплой до запуска бэкенда.
    - >
      ssh -i /tmp/deploy_key -o StrictHostKeyChecking=no $YC_SERVER_USER@$YC_SERVER_IP "
        set -e
        docker rm -f ya-brander-migrate 2>/dev/null || true
        docker run --rm --name ya-brander-migrate --network ya-brander-net \
          -e PGHOST=service-postgres -e PGPORT=5432 \
          -e PGUSER=user -e PGPASSWORD=password -e PGDATABASE=ya_brander_db_1 \
          -e MIGRATIONS_DIR=/postgresql/migrations/db-1 \
          -e ADMIN_EMAIL="$ADMIN_EMAIL" \
          -e ADMIN_PASSWORD_HASH="$ADMIN_PASSWORD_HASH" \
          -v ~/$REMOTE_APP_DIR/backend/postgresql:/postgresql:ro \
          -v ~/$REMOTE_APP_DIR/backend/scripts:/scripts:ro \
          postgres:18 bash /scripts/run_migrations.sh
        echo 'main DB migrations ok'
      "

    # --- 4. Применение миграций к векторной БД (vector_db), если она существует ---
    # Если контейнера нет — пропускаем (это не ошибка). Если есть, но миграции
    # упали — прерываем деплой явным exit 1 (внутри if с set -e статус тела
    # не экранируется автоматически, поэтому проверяем вручную).
    - >
      ssh -i /tmp/deploy_key -o StrictHostKeyChecking=no $YC_SERVER_USER@$YC_SERVER_IP "
        set -e
        if docker inspect service-vector-postgres >/dev/null 2>&1; then
          docker rm -f ya-brander-migrate-vector 2>/dev/null || true
          docker run --rm --name ya-brander-migrate-vector --network ya-brander-net \
            -e PGHOST=service-vector-postgres -e PGPORT=5432 \
            -e PGUSER=user -e PGPASSWORD=password -e PGDATABASE=vector_db \
            -e MIGRATIONS_DIR=/postgresql/migrations/vector-db \
            -v ~/$REMOTE_APP_DIR/backend/postgresql:/postgresql:ro \
            -v ~/$REMOTE_APP_DIR/backend/scripts:/scripts:ro \
            postgres:18 bash /scripts/run_migrations.sh || {
              echo 'vector DB migrations FAILED' >&2
              exit 1
            }
          echo 'vector DB migrations ok'
        else
          echo 'service-vector-postgres not found, skipping vector migrations'
        fi
      "

    # --- 5. Деплой бэкенда ---
    # Команды разнесены по отдельным строкам (без связок &&), чтобы каждая
    # выполнялась безусловно: в частности, docker rm -f ya-brander должен
    # сработать всегда, иначе старый контейнер останется и docker run упадёт
    # с Conflict. Подключение service-postgres к ya-brander-net идемпотентно:
    # сначала отключаем (с подавлением ошибки), затем подключаем.
    - >
      ssh -i /tmp/deploy_key -o StrictHostKeyChecking=no $YC_SERVER_USER@$YC_SERVER_IP "
        docker system prune -af --filter \"until=24h\" || true
        # Сбрасываем docker config: без этого docker login пытается сохранить
        # креды через отсутствующий на сервере docker-credential-yc helper,
        # docker pull не может авторизоваться в registry и тянет старый образ.
        rm -f ~/.docker/config.json || true
        mkdir -p ~/.docker
        echo '$YC_SA_JSON' | docker login --username json_key --password-stdin cr.yandex
        docker pull $REGISTRY/$IMAGE:latest
        docker rm -f ya-brander || true
        docker network create ya-brander-net || true
        docker network disconnect ya-brander-net service-postgres 2>/dev/null || true
        docker network connect ya-brander-net service-postgres || true
        docker rm -f otel-collector || true
        docker run -d --name otel-collector --restart unless-stopped --network ya-brander-net \
          --env-file ~/$REMOTE_APP_DIR/backend/.env \
          -e YA_BRANDER_HOST=ya-brander \
          -e OTEL_SERVICE_NAME=ya-brander \
          -v ~/$REMOTE_APP_DIR/backend/otel/otel-collector.yaml:/etc/otelcol-contrib/config.yaml:ro \
          otel/opentelemetry-collector-contrib:0.159.0
        for i in \$(seq 1 30); do
          docker run --rm --network ya-brander-net curlimages/curl:8.10.1 -sf http://otel-collector:13133 >/dev/null 2>&1 && break
          sleep 1
        done
        docker run --rm --network ya-brander-net curlimages/curl:8.10.1 -sf http://otel-collector:13133 >/dev/null 2>&1 \
          && echo 'otel-collector is ready' \
          || echo 'WARNING: otel-collector not ready after 30s, starting ya-brander anyway'
        docker run -d --name ya-brander --restart unless-stopped --network ya-brander-net -p 8080:8080 --env-file ~/$REMOTE_APP_DIR/backend/.env \
          -e http_proxy=http://backend:1YaBranderTheBest1@172.20.0.1:7890 \
          -e https_proxy=http://backend:1YaBranderTheBest1@172.20.0.1:7890 \
          -e no_proxy=localhost,127.0.0.1,service-postgres,service-vector-postgres,service-redis,service-redis-sentinel \
          $REGISTRY/$IMAGE:latest
        docker ps --filter "name=service-redis" --filter "status=running" -q | grep -q . || \
          echo "WARNING: service-redis не запущен!"
        # Redis-компонент userver общается по протоколу Sentinel даже с одним
        # мастером (нужен для discovery топологии) — голого redis-server
        # недостаточно, рядом должен крутиться настоящий redis-sentinel.
        docker rm -f service-redis-sentinel 2>/dev/null || true
        printf 'port 26379\nsentinel resolve-hostnames yes\nsentinel announce-hostnames yes\nsentinel auth-pass master0 %s\nsentinel monitor master0 service-redis 6379 1\nsentinel down-after-milliseconds master0 5000\nsentinel failover-timeout master0 60000\nsentinel parallel-syncs master0 1\n' '$REDIS_PASSWORD' > /tmp/sentinel.conf
        docker run -d --name service-redis-sentinel --restart unless-stopped --network ya-brander-net \
          -v /tmp/sentinel.conf:/etc/redis/sentinel.conf:ro \
          redis:7 redis-server /etc/redis/sentinel.conf --sentinel
        rm -f /tmp/sentinel.conf
      "

    # --- 6. Проверка работоспособности бэкенда ---
    # После запуска контейнера убеждаемся, что он реально поднялся и на нём
    # зарегистрирована OAuth-ручка. POST /api/v1/auth/yandex с пустым телом
    # должен вернуть 400 (INVALID_CODE). Если приходит 404 — на сервере
    # крутится старый образ без OAuth-хендлера, и деплой прерывается.
    - >
      ssh -i /tmp/deploy_key -o StrictHostKeyChecking=no $YC_SERVER_USER@$YC_SERVER_IP '
        set -e
        sleep 5
        STATE=$(docker inspect --format="{{.State.Running}} {{.RestartCount}}" ya-brander 2>/dev/null || true)
        echo "container state: $STATE"
        if [ "$STATE" != "true 0" ]; then
          echo "ERROR: ya-brander container is not running (or restarting)" >&2
          docker logs --tail 100 ya-brander >&2 || true
          exit 1
        fi
        echo "container OK: running, no restarts"
        CODE=$(docker run --rm --network ya-brander-net curlimages/curl:8.10.1 -s -o /dev/null -w "%{http_code}" -X POST http://ya-brander:8080/api/v1/auth/yandex -H "Content-Type: application/json" -d "{}" 2>/dev/null || true)
        echo "POST /api/v1/auth/yandex -> HTTP $CODE"
        if [ "$CODE" != "400" ]; then
          echo "ERROR: expected HTTP 400 from /api/v1/auth/yandex (OAuth handler), got $CODE" >&2
          exit 1
        fi
        echo "ya-brander OAuth handler is live"
      '